<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Libri di Carta</title>
<style>
:root{--ink:#2d251f;--line:#d8c4ad;--gold:#e6a01d;--muted:#75685d}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{min-height:100vh;color:var(--ink);font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;background:#f6eee3;overflow-x:hidden}

/* SFONDO: tutto costruito qui, senza immagini raster esterne. */
.library-wall{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:
radial-gradient(circle at 16% 14%,rgba(255,255,255,.55),transparent 31%),
radial-gradient(circle at 80% 32%,rgba(230,205,174,.14),transparent 35%),
radial-gradient(circle at 48% 78%,rgba(255,255,255,.28),transparent 42%),
linear-gradient(115deg,#f8f1e8 0%,#f4eadc 48%,#f8f0e6 100%)}
.library-wall:before{content:"";position:absolute;inset:0;opacity:.32;background-image:
repeating-linear-gradient(8deg,rgba(133,101,67,.022) 0 1px,transparent 1px 6px),
repeating-linear-gradient(94deg,rgba(255,255,255,.085) 0 1px,transparent 1px 8px)}
.library-wall:after{content:"";position:absolute;inset:0;opacity:.18;background:
radial-gradient(ellipse at 20% 25%,rgba(122,88,55,.08) 0 1px,transparent 1.6px),
radial-gradient(ellipse at 67% 54%,rgba(122,88,55,.07) 0 1px,transparent 1.7px),
radial-gradient(ellipse at 44% 82%,rgba(122,88,55,.06) 0 1px,transparent 1.5px);background-size:27px 23px,31px 29px,37px 34px}
.bg-decor{position:absolute;filter:drop-shadow(0 10px 12px rgba(94,67,40,.13))}
.bg-flowers{left:clamp(10px,1.2vw,25px);top:clamp(85px,10vh,125px);height:min(74vh,790px);width:auto}
.bg-clips{left:clamp(45px,4.2vw,85px);bottom:clamp(22px,4vh,48px);width:min(9vw,150px);min-width:92px;height:auto;filter:drop-shadow(0 6px 7px rgba(80,56,33,.18))}
.bg-pencil{right:clamp(10px,1.3vw,28px);bottom:clamp(20px,3vh,38px);height:min(70vh,760px);width:auto;transform:rotate(7deg);transform-origin:50% 100%;filter:drop-shadow(8px 12px 13px rgba(77,54,34,.2))}

header{position:sticky;top:0;z-index:10;padding:18px 0;background:transparent}.nav{max-width:1180px;margin:auto;min-height:54px;padding:0 18px;display:flex;align-items:center;gap:26px;background:rgba(250,241,229,.93);border:1px solid rgba(178,145,109,.22);border-radius:14px;box-shadow:0 3px 14px rgba(86,58,34,.08)}.brand{display:flex;align-items:center;gap:10px;min-width:210px}.brand .books{font-size:31px}.brand strong{font-size:22px;font-weight:500}.links{display:flex;gap:21px;flex:1;justify-content:center;white-space:nowrap}.links a{text-decoration:none;color:var(--ink);font-size:13px}.links a:first-child{border-bottom:1px solid var(--ink)}.search{background:#fff8;border:1px solid #ddcab8;border-radius:10px;padding:7px 11px;display:flex;gap:7px;min-width:220px}.search input{border:0;background:transparent;outline:0;width:100%;font:inherit;font-size:12px}
main{position:relative;z-index:2;max-width:1040px;margin:8px auto 70px;padding:0 18px}.intro{margin:0 0 13px 0}.intro h1{font-size:29px;font-weight:500;margin:0 0 3px}.intro p{margin:0;color:var(--muted);font-size:13px}.pagination{display:grid;grid-template-columns:62px 1fr 62px;align-items:center;gap:16px;margin:0 0 20px}.page-arrow{height:42px;border:1px solid #d4bea7;background:rgba(248,237,220,.96);border-radius:9px;box-shadow:0 5px 12px rgba(82,56,35,.13);font-size:24px;color:var(--ink);cursor:pointer}.page-arrow:disabled{opacity:.32;cursor:default}.page-status{text-align:center;font-size:13px;color:var(--muted);line-height:1.65}.page-status strong{color:var(--ink);font-size:15px;font-weight:500}
.book{background:rgba(252,247,239,.94);border:1px solid rgba(170,130,90,.18);border-radius:15px;box-shadow:0 9px 22px rgba(82,56,35,.12);padding:20px 25px;margin:0 0 14px;display:grid;grid-template-columns:150px 1fr;gap:26px;position:relative;overflow:hidden}.cover-wrap{position:relative;padding:8px;background:#f8eee1;border-radius:5px;box-shadow:0 4px 10px #5a3b2522;align-self:start}.tape{position:absolute;width:67px;height:18px;background:#e6c99aaa;top:-9px;left:50%;transform:translateX(-50%) rotate(-1deg)}.cover{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#d7c1aa}.info{padding-right:37px}.title{font-size:22px;font-weight:400;margin:0 0 2px;border-bottom:1px solid #928277;display:inline-block;padding-bottom:3px}.author{font-size:14px;margin:2px 0 12px}.label{font-size:10px;border-bottom:1px solid #928277;display:inline-block;margin-bottom:4px}.plot{font-size:11px;line-height:1.55;margin:0 0 12px}.meta{display:grid;grid-template-columns:.65fr .7fr 1.5fr;gap:10px;margin-top:8px}.panel,.notes{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:rgba(255,255,255,.13);min-height:70px}.panel h3{font-size:10px;font-weight:400;margin:0 0 7px;border-bottom:1px solid #928277;display:inline-block}.stars{display:flex;gap:1px}.star{border:0;background:transparent;color:#b3aaa2;font-size:20px;padding:0;cursor:pointer}.star.on{color:var(--gold)}.loan{font-size:11px;line-height:1.5}.loan input{font:inherit;border:0;border-bottom:1px dashed #bca995;background:transparent;outline:0;width:100%}.notes textarea{width:100%;min-height:45px;resize:vertical;border:0;background:transparent;outline:0;font:inherit;font-size:11px;line-height:1.45;color:var(--ink)}.read-corner{position:absolute;right:18px;top:14px;z-index:4;cursor:pointer}.read-corner input{position:absolute;opacity:0}.read-box{width:25px;height:25px;border:2px solid #5f554c;border-radius:3px;background:#fffaf2;display:grid;place-items:center;font-family:Arial,sans-serif;font-size:18px;font-weight:bold;color:#fff}.read-corner input:checked+.read-box{background:#607e56;border-color:#607e56}.read-corner input:checked+.read-box:after{content:"✓"}
@media(max-width:1200px){.bg-flowers{opacity:.86;left:-8px}.bg-pencil{right:-5px;opacity:.9}.bg-clips{left:25px}}
@media(max-width:900px){.links{display:none}.brand{min-width:auto}.search{margin-left:auto}.book{grid-template-columns:130px 1fr}.meta{grid-template-columns:1fr 1fr}.notes{grid-column:1/-1}.bg-flowers{height:56vh;opacity:.34}.bg-pencil{height:52vh;opacity:.28}.bg-clips{opacity:.25}}
@media(max-width:620px){header{padding:8px 0}.nav{margin:0 8px}.brand strong{font-size:19px}.brand .books{font-size:27px}.search{min-width:0}.book{grid-template-columns:1fr;padding:18px 15px}.cover-wrap{width:150px;margin:auto}.info{padding-right:0}.title{font-size:20px;padding-right:30px}.meta{grid-template-columns:1fr}.notes{grid-column:auto}.pagination{grid-template-columns:46px 1fr 46px}.page-arrow{height:38px}.read-corner{right:12px;top:12px}.bg-decor{display:none}}
</style>
</head>
<body>
<div class="library-wall" aria-hidden="true">
  <svg class="bg-decor bg-flowers" viewBox="0 0 310 900" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="stem" x1="0" x2="1"><stop offset="0" stop-color="#8a672f"/><stop offset=".45" stop-color="#b58a49"/><stop offset=".72" stop-color="#725322"/><stop offset="1" stop-color="#c49a56"/></linearGradient>
      <radialGradient id="petal" cx="38%" cy="35%"><stop offset="0" stop-color="#e9cf90"/><stop offset=".45" stop-color="#caa35d"/><stop offset=".8" stop-color="#a97935"/><stop offset="1" stop-color="#74501f"/></radialGradient>
      <radialGradient id="core"><stop offset="0" stop-color="#6e4b20"/><stop offset=".55" stop-color="#8c6429"/><stop offset="1" stop-color="#4d3519"/></radialGradient>
      <filter id="flowerShadow" x="-80%" y="-80%" width="260%" height="260%"><feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#4d351d" flood-opacity=".24"/></filter>

        <g fill="url(#petal)" stroke="#8e682f" stroke-width=".45">

        </g><circle r="10" fill="url(#core)"/><circle r="4" fill="#4f3516" opacity=".8"/>
      </g>
    </defs>
    <g fill="none" stroke="url(#stem)" stroke-linecap="round">
      <path d="M52 865 C69 709 73 545 101 380 C118 280 133 177 151 58" stroke-width="4.5"/>
      <path d="M90 868 C93 724 123 576 155 432 C179 320 198 206 230 92" stroke-width="4"/>
      <path d="M67 867 C84 733 110 640 135 540 C151 476 163 401 175 326" stroke-width="3.3"/>
      <path d="M57 863 C47 748 53 651 67 559 C83 453 96 360 105 268" stroke-width="2.7"/>
      <path d="M85 868 C112 763 143 691 178 618 C207 556 225 491 242 416" stroke-width="2.7"/>
    </g>
    <g fill="none" stroke="#9f773a" stroke-width="2" stroke-linecap="round">
      <path d="M112 314 L55 258"/><path d="M126 231 L83 178"/><path d="M143 145 L103 107"/><path d="M164 390 L214 327"/><path d="M183 286 L245 223"/><path d="M200 190 L265 149"/><path d="M139 535 L78 477"/><path d="M160 459 L213 411"/><path d="M94 448 L43 393"/><path d="M72 596 L32 546"/><path d="M180 616 L255 563"/>
    </g>
    <g>
      <use href="#flower" x="151" y="58" transform="scale(1.05) translate(-7 -3)"/><use href="#flower" x="230" y="92" transform="scale(.92) translate(20 8)"/>
      <use href="#flower" x="103" y="107" transform="scale(.78) translate(28 30)"/><use href="#flower" x="83" y="178" transform="scale(.74) translate(29 62)"/>
      <use href="#flower" x="55" y="258" transform="scale(.74) translate(20 94)"/><use href="#flower" x="265" y="149" transform="scale(.82) translate(50 34)"/>
      <use href="#flower" x="245" y="223" transform="scale(.7) translate(76 95)"/><use href="#flower" x="214" y="327" transform="scale(.72) translate(74 126)"/>
      <use href="#flower" x="175" y="326" transform="scale(.72) translate(67 126)"/><use href="#flower" x="213" y="411" transform="scale(.62) translate(124 249)"/>
      <use href="#flower" x="78" y="477" transform="scale(.64) translate(45 264)"/><use href="#flower" x="43" y="393" transform="scale(.58) translate(31 286)"/>
      <use href="#flower" x="32" y="546" transform="scale(.55) translate(26 448)"/><use href="#flower" x="255" y="563" transform="scale(.62) translate(157 345)"/>
    </g>
    <path d="M49 707 C77 700 96 702 120 714" fill="none" stroke="#b08a50" stroke-width="8" opacity=".7"/><path d="M48 716 C80 709 96 712 121 722" fill="none" stroke="#d5b47b" stroke-width="2.4"/>
  </svg>

  <svg class="bg-decor bg-clips" viewBox="0 0 180 190" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6c4d24"/><stop offset=".18" stop-color="#e0bc78"/><stop offset=".42" stop-color="#8f652f"/><stop offset=".68" stop-color="#f0d494"/><stop offset="1" stop-color="#6f4b20"/></linearGradient><filter id="clipShadow"><feDropShadow dx="2" dy="4" stdDeviation="2.5" flood-color="#4c3218" flood-opacity=".25"/></filter></defs>
    <g fill="none" stroke="url(#metal)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#clipShadow)">
      <path d="M34 9 C62 -3 82 31 60 50 L28 79 C3 100 -22 65 2 45 L32 18 C43 8 57 24 46 34 L20 57"/>
      <path d="M105 54 C132 43 150 76 129 95 L97 124 C73 145 47 111 72 90 L102 63 C113 53 128 69 116 80 L91 102"/>
      <path d="M55 111 C82 100 101 132 80 152 L48 181 C24 201 -1 168 23 147 L53 120 C65 109 79 126 68 136 L42 159"/>
    </g>
    <g fill="none" stroke="#fff2c8" stroke-width="1.4" opacity=".65"><path d="M34 9 C62 -3 82 31 60 50"/><path d="M105 54 C132 43 150 76 129 95"/><path d="M55 111 C82 100 101 132 80 152"/></g>
  </svg>

  <svg class="bg-decor bg-pencil" viewBox="0 0 150 820" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="wood" x1="0" x2="1"><stop offset="0" stop-color="#bd7d35"/><stop offset=".16" stop-color="#e8b767"/><stop offset=".38" stop-color="#c88940"/><stop offset=".62" stop-color="#efbf72"/><stop offset=".84" stop-color="#b97631"/><stop offset="1" stop-color="#e3aa5c"/></linearGradient>
      <linearGradient id="sharpen" x1="0" x2="1"><stop offset="0" stop-color="#c38d56"/><stop offset=".45" stop-color="#f1d0a1"/><stop offset=".68" stop-color="#d5a06a"/><stop offset="1" stop-color="#ae7040"/></linearGradient>
      <linearGradient id="ferrule" x1="0" x2="1"><stop offset="0" stop-color="#8d6524"/><stop offset=".2" stop-color="#f6df8c"/><stop offset=".42" stop-color="#a77a2a"/><stop offset=".68" stop-color="#ffe9a0"/><stop offset="1" stop-color="#8d6320"/></linearGradient>
      <linearGradient id="eraser" x1="0" x2="1"><stop offset="0" stop-color="#8e3f36"/><stop offset=".35" stop-color="#c76556"/><stop offset=".7" stop-color="#a94b40"/><stop offset="1" stop-color="#7e352e"/></linearGradient>
    </defs>
    <polygon points="75,6 32,112 118,112" fill="url(#sharpen)"/><polygon points="75,6 62,39 88,39" fill="#292725"/>
    <polygon points="32,112 118,112 106,688 44,688" fill="url(#wood)"/>
    <path d="M49 120 L59 681 M79 120 L75 681 M108 120 L93 681" stroke="#f7d394" stroke-width="2" opacity=".4"/>
    <path d="M38 114 L48 688 M114 114 L103 688" stroke="#875523" stroke-width="2.4" opacity=".38"/>
    <rect x="43" y="688" width="63" height="13" rx="2" fill="#836025"/><rect x="43" y="701" width="63" height="43" rx="3" fill="url(#ferrule)"/>
    <path d="M45 710 H104 M45 722 H104 M45 734 H104" stroke="#75501d" stroke-width="2" opacity=".75"/>
    <rect x="43" y="744" width="63" height="62" rx="10" fill="url(#eraser)"/><path d="M51 756 H99" stroke="#e69686" stroke-width="3" opacity=".45"/>

</div>

<header><div class="nav"><div class="brand"><span class="books">📚</span><strong>Libri di Carta</strong></div><div class="links"><a href="#">Home</a><a href="#">La mia libreria</a><a href="#">Letti</a><a href="#">Da leggere</a><a href="#">Prestati</a><a href="#">Autori</a><a href="#">Categorie</a></div><label class="search">⌕<input id="search" placeholder="Cerca un libro, autore…"></label></div></header>
<main><div class="intro"><h1>La mia libreria</h1><p>Tutti i libri, uno sotto l’altro.</p></div><div class="pagination"><button class="page-arrow" id="prevPage">←</button><div class="page-status" id="pageStatus"></div><button class="page-arrow" id="nextPage">→</button></div><div id="list"></div></main>
<script>
const books=[
{id:1,title:"Stand by me - Ricordo di un’estate",author:"Stephen King",cover:"https://covers.openlibrary.org/b/isbn/9788804679349-L.jpg",plot:"Quattro ragazzi partono per un’avventura che cambierà per sempre le loro vite. Lungo il cammino scopriranno il coraggio, l’amicizia e il valore dei ricordi che restano.",rating:4,read:true,loanTo:"Marco B.",loanDate:"12/05/2024",notes:"Libro stupendo. Mi ha fatto tornare agli anni dell’adolescenza e al valore delle amicizie vere. Finale commovente."},
{id:2,title:"Misery",author:"Stephen King",cover:"https://covers.openlibrary.org/b/isbn/9780451169525-L.jpg",plot:"Dopo un incidente d’auto, lo scrittore Paul Sheldon viene soccorso dalla sua ammiratrice Annie Wilkes. Quella che sembra una salvezza si trasforma presto in una prigionia inquietante.",rating:5,read:true,loanTo:"",loanDate:"",notes:"Tesissimo e claustrofobico. Annie Wilkes è uno dei personaggi più memorabili di King."},
{id:3,title:"Shining",author:"Stephen King",cover:"https://covers.openlibrary.org/b/isbn/9780307743657-L.jpg",plot:"Jack Torrance accetta un lavoro invernale all’Overlook Hotel e vi si trasferisce con la moglie Wendy e il figlio Danny. L’isolamento e le presenze dell’hotel metteranno la famiglia in grave pericolo.",rating:3,read:false,loanTo:"Sara",loanDate:"02/08/2026",notes:"Da rileggere con calma: l’atmosfera dell’Overlook è la parte che mi è rimasta più impressa."}
];
const PAGE_SIZE=50;let currentPage=1;
const $=id=>document.getElementById(id);
function stars(n,id){return [1,2,3,4,5].map(v=>`<button class="star ${v<=n?'on':''}" data-id="${id}" data-v="${v}">★</button>`).join('')}
function render(){const q=$('search').value.toLowerCase().trim();const f=books.filter(b=>`${b.title} ${b.author}`.toLowerCase().includes(q));const pages=Math.max(1,Math.ceil(f.length/PAGE_SIZE));if(currentPage>pages)currentPage=pages;const start=(currentPage-1)*PAGE_SIZE;const vis=f.slice(start,start+PAGE_SIZE);$('list').innerHTML=vis.map(b=>`<section class="book"><label class="read-corner"><input type="checkbox" data-read="${b.id}" ${b.read?'checked':''}><span class="read-box"></span></label><div class="cover-wrap"><div class="tape"></div><img class="cover" src="${b.cover}" alt="Copertina di ${b.title}"></div><div class="info"><h2 class="title">${b.title}</h2><p class="author">${b.author}</p><span class="label">TRAMA</span><p class="plot">${b.plot}</p><div class="meta"><div class="panel"><h3>IL MIO RATING</h3><div class="stars">${stars(b.rating,b.id)}</div></div><div class="panel"><h3>PRESTATO A</h3><div class="loan"><input data-loan="${b.id}" value="${b.loanTo}" placeholder="Nessuno">${b.loanDate?`<div>Dal ${b.loanDate}</div>`:''}</div></div><div class="notes"><span class="label">LE MIE NOTE</span><textarea data-notes="${b.id}">${b.notes}</textarea></div></div></div></section>`).join('');const from=f.length?start+1:0,to=Math.min(start+PAGE_SIZE,f.length);$('pageStatus').innerHTML=`<strong>Pagina ${currentPage} di ${pages}</strong><br>Mostra ${from}–${to} di ${f.length} libri (50 per pagina)`;$('prevPage').disabled=currentPage<=1;$('nextPage').disabled=currentPage>=pages;bind()}
function bind(){document.querySelectorAll('.star').forEach(s=>s.onclick=()=>{books.find(x=>x.id==s.dataset.id).rating=+s.dataset.v;render()});document.querySelectorAll('[data-read]').forEach(c=>c.onchange=()=>{books.find(x=>x.id==c.dataset.read).read=c.checked;render()});document.querySelectorAll('[data-loan]').forEach(i=>i.onchange=()=>books.find(x=>x.id==i.dataset.loan).loanTo=i.value);document.querySelectorAll('[data-notes]').forEach(t=>t.onchange=()=>books.find(x=>x.id==t.dataset.notes).notes=t.value)}
$('search').oninput=()=>{currentPage=1;render()};$('prevPage').onclick=()=>{if(currentPage>1){currentPage--;render();scrollTo({top:0,behavior:'smooth'})}};$('nextPage').onclick=()=>{const q=$('search').value.toLowerCase().trim();const pages=Math.max(1,Math.ceil(books.filter(b=>`${b.title} ${b.author}`.toLowerCase().includes(q)).length/PAGE_SIZE));if(currentPage<pages){currentPage++;render();scrollTo({top:0,behavior:'smooth'})}};render();
</script>
</body></html>
