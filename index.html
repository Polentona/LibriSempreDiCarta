<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Libri di Carta</title>
<style>
:root{--ink:#2d251f;--line:#d8c4ad;--gold:#e6a01d;--muted:#75685d}
*{box-sizing:border-box}html{scroll-behavior:smooth}html,body{margin:0;min-height:100%}
body{min-height:100vh;color:var(--ink);font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;background:#f6eee3;overflow-x:hidden}
.library-wall{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:radial-gradient(circle at 18% 12%,rgba(255,255,255,.58),transparent 30%),radial-gradient(circle at 84% 35%,rgba(224,194,158,.13),transparent 35%),radial-gradient(circle at 46% 78%,rgba(255,255,255,.26),transparent 38%),linear-gradient(112deg,#faf4ec 0%,#f5eadc 48%,#faf3e9 100%)}
.library-wall:before{content:"";position:absolute;inset:0;opacity:.30;background-image:repeating-linear-gradient(9deg,rgba(117,84,53,.022) 0 1px,transparent 1px 7px),repeating-linear-gradient(92deg,rgba(255,255,255,.13) 0 1px,transparent 1px 10px)}
.real-decor{position:absolute;display:block;user-select:none;-webkit-user-drag:none;object-fit:contain}
.dried-flowers{left:0;top:8vh;width:min(18vw,285px);height:78vh;object-fit:contain;object-position:left center;mix-blend-mode:multiply;filter:sepia(.32) saturate(.78) brightness(1.08) drop-shadow(2px 9px 9px rgba(85,58,33,.14));-webkit-mask-image:radial-gradient(ellipse 92% 94% at 35% 48%,#000 64%,transparent 100%);mask-image:radial-gradient(ellipse 92% 94% at 35% 48%,#000 64%,transparent 100%)}
.pencil-photo{right:1.2vw;bottom:2.2vh;height:min(72vh,760px);width:auto;mix-blend-mode:multiply;transform:rotate(5deg);transform-origin:50% 50%;filter:sepia(.08) saturate(.95) drop-shadow(7px 12px 10px rgba(65,44,27,.20))}
.clip-photo{width:clamp(30px,2.6vw,46px);height:clamp(84px,8.6vw,132px);object-fit:contain;mix-blend-mode:multiply;filter:sepia(.44) saturate(.78) brightness(.96) drop-shadow(2px 4px 4px rgba(74,50,28,.18))}
.clip1{left:3.1vw;bottom:13vh;transform:rotate(20deg)}.clip2{left:5.3vw;bottom:7.2vh;transform:rotate(-15deg) scale(.91)}.clip3{left:2.9vw;bottom:2.5vh;transform:rotate(31deg) scale(.86)}
header{position:sticky;top:0;z-index:10;padding:18px 0;background:transparent}.nav{max-width:1180px;margin:auto;min-height:54px;padding:0 18px;display:flex;align-items:center;gap:26px;background:rgba(250,241,229,.93);border:1px solid rgba(178,145,109,.22);border-radius:14px;box-shadow:0 3px 14px rgba(86,58,34,.08)}.brand{display:flex;align-items:center;gap:10px;min-width:210px}.brand .books{font-size:31px}.brand strong{font-size:22px;font-weight:500}.links{display:flex;gap:21px;flex:1;justify-content:center;white-space:nowrap}.links a{text-decoration:none;color:var(--ink);font-size:13px}.links a:first-child{border-bottom:1px solid var(--ink)}.search{background:#fff8;border:1px solid #ddcab8;border-radius:10px;padding:7px 11px;display:flex;gap:7px;min-width:220px}.search input{border:0;background:transparent;outline:0;width:100%;font:inherit;font-size:12px}
main{position:relative;z-index:2;max-width:1040px;margin:8px auto 70px;padding:0 18px}.intro{margin:0 0 13px}.intro h1{font-size:29px;font-weight:500;margin:0 0 3px}.intro p{margin:0;color:var(--muted);font-size:13px}.pagination{display:grid;grid-template-columns:62px 1fr 62px;align-items:center;gap:16px;margin:0 0 20px}.page-arrow{height:42px;border:1px solid #d4bea7;background:rgba(248,237,220,.96);border-radius:9px;box-shadow:0 5px 12px rgba(82,56,35,.13);font-size:24px;color:var(--ink);cursor:pointer}.page-arrow:disabled{opacity:.32;cursor:default}.page-status{text-align:center;font-size:13px;color:var(--muted);line-height:1.65}.page-status strong{color:var(--ink);font-size:15px;font-weight:500}
.book{background:rgba(252,247,239,.94);border:1px solid rgba(170,130,90,.18);border-radius:15px;box-shadow:0 9px 22px rgba(82,56,35,.12);padding:20px 25px;margin:0 0 14px;display:grid;grid-template-columns:150px 1fr;gap:26px;position:relative;overflow:hidden}.cover-wrap{position:relative;padding:8px;background:#f8eee1;border-radius:5px;box-shadow:0 4px 10px #5a3b2522;align-self:start}.tape{position:absolute;width:67px;height:18px;background:#e6c99aaa;top:-9px;left:50%;transform:translateX(-50%) rotate(-1deg)}.cover{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#d7c1aa}.info{padding-right:37px}.title{font-size:22px;font-weight:400;margin:0 0 2px;border-bottom:1px solid #928277;display:inline-block;padding-bottom:3px}.author{font-size:14px;margin:2px 0 12px}.label{font-size:10px;border-bottom:1px solid #928277;display:inline-block;margin-bottom:4px}.plot{font-size:11px;line-height:1.55;margin:0 0 12px}.meta{display:grid;grid-template-columns:.65fr .7fr 1.5fr;gap:10px;margin-top:8px}.panel,.notes{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:rgba(255,255,255,.13);min-height:70px}.panel h3{font-size:10px;font-weight:400;margin:0 0 7px;border-bottom:1px solid #928277;display:inline-block}.stars{display:flex;gap:1px}.star{border:0;background:transparent;color:#b3aaa2;font-size:20px;padding:0;cursor:pointer}.star.on{color:var(--gold)}.loan{font-size:11px;line-height:1.5}.loan input{font:inherit;border:0;border-bottom:1px dashed #bca995;background:transparent;outline:0;width:100%}.notes textarea{width:100%;min-height:45px;resize:vertical;border:0;background:transparent;outline:0;font:inherit;font-size:11px;line-height:1.45;color:var(--ink)}.read-corner{position:absolute;right:18px;top:14px;z-index:4;cursor:pointer}.read-corner input{position:absolute;opacity:0}.read-box{width:25px;height:25px;border:2px solid #5f554c;border-radius:3px;background:#fffaf2;display:grid;place-items:center;font-family:Arial,sans-serif;font-size:18px;font-weight:bold;color:#fff}.read-corner input:checked+.read-box{background:#607e56;border-color:#607e56}.read-corner input:checked+.read-box:after{content:"✓"}
.credits{max-width:1040px;margin:28px auto 20px;padding:0 18px;font-family:Arial,sans-serif;font-size:9px;color:#8b7d70;opacity:.55}.credits a{color:inherit}
@media(max-width:1320px){main{max-width:920px}.nav{max-width:1080px}.dried-flowers{width:17vw;opacity:.82}.pencil-photo{height:66vh;opacity:.88}}
@media(max-width:1050px){.dried-flowers{left:-35px;opacity:.35}.pencil-photo{right:-28px;opacity:.30}.clip-photo{opacity:.25}.links{display:none}.brand{min-width:auto}.search{margin-left:auto}.book{grid-template-columns:130px 1fr}.meta{grid-template-columns:1fr 1fr}.notes{grid-column:1/-1}}
@media(max-width:620px){header{padding:8px 0}.nav{margin:0 8px}.brand strong{font-size:19px}.brand .books{font-size:27px}.search{min-width:0}.book{grid-template-columns:1fr;padding:18px 15px}.cover-wrap{width:150px;margin:auto}.info{padding-right:0}.title{font-size:20px;padding-right:30px}.meta{grid-template-columns:1fr}.notes{grid-column:auto}.pagination{grid-template-columns:46px 1fr 46px}.page-arrow{height:38px}.read-corner{right:12px;top:12px}.real-decor{display:none}}
</style>
</head>
<body>
<div class="library-wall" aria-hidden="true">
  <img class="real-decor dried-flowers" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Davana-Dried.jpg" alt="">
  <img class="real-decor pencil-photo" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/ScannedPencil.png" alt="">
  <img class="real-decor clip-photo clip1" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Paperclip.jpeg" alt="">
  <img class="real-decor clip-photo clip2" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Paperclip.jpeg" alt="">
  <img class="real-decor clip-photo clip3" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Paperclip.jpeg" alt="">
</div>
<header><div class="nav"><div class="brand"><span class="books">📚</span><strong>Libri di Carta</strong></div><div class="links"><a href="#">Home</a><a href="#">La mia libreria</a><a href="#">Letti</a><a href="#">Da leggere</a><a href="#">Prestati</a><a href="#">Autori</a><a href="#">Categorie</a></div><label class="search">⌕<input id="search" placeholder="Cerca un libro, autore…"></label></div></header>
<main><div class="intro"><h1>La mia libreria</h1><p>Tutti i libri, uno sotto l’altro.</p></div><div class="pagination"><button class="page-arrow" id="prevPage">←</button><div class="page-status" id="pageStatus"></div><button class="page-arrow" id="nextPage">→</button></div><div id="list"></div></main>
<div class="credits">Elementi fotografici decorativi: Wikimedia Commons — <a href="https://commons.wikimedia.org/wiki/File:Davana-Dried.jpg">Davana-Dried</a>, <a href="https://commons.wikimedia.org/wiki/File:ScannedPencil.png">ScannedPencil</a>, <a href="https://commons.wikimedia.org/wiki/File:Paperclip.jpeg">Paperclip scan</a>.</div>
<script>
const books=[
{id:1,title:"Stand by me - Ricordo di un’estate",author:"Stephen King",cover:"https://covers.openlibrary.org/b/isbn/9788804679349-L.jpg",plot:"Quattro ragazzi partono per un’avventura che cambierà per sempre le loro vite. Lungo il cammino scopriranno il coraggio, l’amicizia e il valore dei ricordi che restano.",rating:4,read:true,loanTo:"Marco B.",loanDate:"12/05/2024",notes:"Libro stupendo. Mi ha fatto tornare agli anni dell’adolescenza e al valore delle amicizie vere. Finale commovente."},
{id:2,title:"Misery",author:"Stephen King",cover:"https://covers.openlibrary.org/b/isbn/9780451169525-L.jpg",plot:"Dopo un incidente d’auto, lo scrittore Paul Sheldon viene soccorso dalla sua ammiratrice Annie Wilkes. Quella che sembra una salvezza si trasforma presto in una prigionia inquietante.",rating:5,read:true,loanTo:"",loanDate:"",notes:"Tesissimo e claustrofobico. Annie Wilkes è uno dei personaggi più memorabili di King."},
{id:3,title:"Shining",author:"Stephen King",cover:"https://covers.openlibrary.org/b/isbn/9780307743657-L.jpg",plot:"Jack Torrance accetta un lavoro invernale all’Overlook Hotel e vi si trasferisce con la moglie Wendy e il figlio Danny. L’isolamento e le presenze dell’hotel metteranno la famiglia in grave pericolo.",rating:3,read:false,loanTo:"Sara",loanDate:"02/08/2026",notes:"Da rileggere con calma: l’atmosfera dell’Overlook è la parte che mi è rimasta più impressa."}
];
const PAGE_SIZE=50;let currentPage=1;const $=id=>document.getElementById(id);
function stars(n,id){return [1,2,3,4,5].map(v=>`<button class="star ${v<=n?'on':''}" data-id="${id}" data-v="${v}">★</button>`).join('')}
function render(){const q=$('search').value.toLowerCase().trim();const f=books.filter(b=>`${b.title} ${b.author}`.toLowerCase().includes(q));const pages=Math.max(1,Math.ceil(f.length/PAGE_SIZE));if(currentPage>pages)currentPage=pages;const start=(currentPage-1)*PAGE_SIZE;const vis=f.slice(start,start+PAGE_SIZE);$('list').innerHTML=vis.map(b=>`<section class="book"><label class="read-corner"><input type="checkbox" data-read="${b.id}" ${b.read?'checked':''}><span class="read-box"></span></label><div class="cover-wrap"><div class="tape"></div><img class="cover" src="${b.cover}" alt="Copertina di ${b.title}"></div><div class="info"><h2 class="title">${b.title}</h2><p class="author">${b.author}</p><span class="label">TRAMA</span><p class="plot">${b.plot}</p><div class="meta"><div class="panel"><h3>IL MIO RATING</h3><div class="stars">${stars(b.rating,b.id)}</div></div><div class="panel"><h3>PRESTATO A</h3><div class="loan"><input data-loan="${b.id}" value="${b.loanTo}" placeholder="Nessuno">${b.loanDate?`<div>Dal ${b.loanDate}</div>`:''}</div></div><div class="notes"><span class="label">LE MIE NOTE</span><textarea data-notes="${b.id}">${b.notes}</textarea></div></div></div></section>`).join('');const from=f.length?start+1:0,to=Math.min(start+PAGE_SIZE,f.length);$('pageStatus').innerHTML=`<strong>Pagina ${currentPage} di ${pages}</strong><br>Mostra ${from}–${to} di ${f.length} libri (50 per pagina)`;$('prevPage').disabled=currentPage<=1;$('nextPage').disabled=currentPage>=pages;bind()}
function bind(){document.querySelectorAll('.star').forEach(s=>s.onclick=()=>{books.find(x=>x.id==s.dataset.id).rating=+s.dataset.v;render()});document.querySelectorAll('[data-read]').forEach(c=>c.onchange=()=>{books.find(x=>x.id==c.dataset.read).read=c.checked;render()});document.querySelectorAll('[data-loan]').forEach(i=>i.onchange=()=>books.find(x=>x.id==i.dataset.loan).loanTo=i.value);document.querySelectorAll('[data-notes]').forEach(t=>t.onchange=()=>books.find(x=>x.id==t.dataset.notes).notes=t.value)}
$('search').oninput=()=>{currentPage=1;render()};$('prevPage').onclick=()=>{if(currentPage>1){currentPage--;render();scrollTo({top:0,behavior:'smooth'})}};$('nextPage').onclick=()=>{const q=$('search').value.toLowerCase().trim();const pages=Math.max(1,Math.ceil(books.filter(b=>`${b.title} ${b.author}`.toLowerCase().includes(q)).length/PAGE_SIZE));if(currentPage<pages){currentPage++;render();scrollTo({top:0,behavior:'smooth'})}};render();
</script>
</body></html>
