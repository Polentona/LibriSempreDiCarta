name: Attiva ordine saghe Google Books v10
on:
  push:
    paths:
      - '.github/workflows/activate-google-series-v10-once.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Collega il nuovo motore
        run: |
          python - <<'PY'
          from pathlib import Path
          idx=Path('index.html')
          s=idx.read_text(encoding='utf-8')
          marker='<script src="series-wikipedia-authoritative-v3.js?v=1"></script>\n'
          add=marker+'<script src="series-google-books-order-v10.js?v=1"></script>\n'
          if 'series-google-books-order-v10.js' not in s:
              if marker not in s: raise SystemExit('Marker Wikipedia non trovato')
              s=s.replace(marker,add,1)
              idx.write_text(s,encoding='utf-8')
          p=Path('isbn-cover.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('const RELATIONS_LOOKUP_VERSION=9','const RELATIONS_LOOKUP_VERSION=10')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verifica JavaScript
        run: |
          node --check series-google-books-order-v10.js
          node --check isbn-cover.js
      - name: Pubblica e pulisce workflow temporaneo
        run: |
          rm -f .github/workflows/activate-google-series-v10-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ricava prequel e sequel dalle edizioni raccolte"
          git push
