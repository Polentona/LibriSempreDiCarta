name: Patch diretta prequel sequel v5
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Applica resolver standalone al flusso ISBN
        shell: python
        run: |
          from pathlib import Path

          p = Path('isbn-cover.js')
          s = p.read_text(encoding='utf-8')
          marker = 'window.__LIB_RESOLVE_SERIES_NEIGHBORS'
          if marker not in s:
              needle = "      }catch(e){console.warn('Relazioni serie non disponibili',e)}\n    }\n    const forcedCover=verifiedUiCover(code);"
              block = "      }catch(e){console.warn('Relazioni serie non disponibili',e)}\n    }\n"
              block += "    if(type==='isbn'&&typeof window.__LIB_RESOLVE_SERIES_NEIGHBORS==='function'&&candidate.title&&candidate.author&&(!candidate.prequel||!candidate.sequel)){\n"
              block += "      try{\n"
              block += "        const rel2=await window.__LIB_RESOLVE_SERIES_NEIGHBORS({code,title:candidate.title,author:candidate.author,saga:candidate.saga,description:candidate.description||''});\n"
              block += "        window.__LIB_LAST_NEIGHBORS_RESULT__=rel2||null;\n"
              block += "        if(rel2?.saga&&!candidate.saga){candidate.saga=String(rel2.saga).trim();setAutoField('editSaga',candidate.saga,true)}\n"
              block += "        if(rel2?.prequel){candidate.prequel=String(rel2.prequel).trim();setAutoField('editPrequel',candidate.prequel,true)}\n"
              block += "        if(rel2?.sequel){candidate.sequel=String(rel2.sequel).trim();setAutoField('editSequel',candidate.sequel,true)}\n"
              block += "      }catch(e){window.__LIB_LAST_NEIGHBORS_ERROR__=String(e&&e.message||e);console.warn('Resolver finale prequel/sequel non disponibile',e)}\n"
              block += "    }\n    const forcedCover=verifiedUiCover(code);"
              if needle not in s:
                  raise SystemExit('Anchor applyCandidate non trovato')
              s = s.replace(needle, block, 1)
              p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('bg${i}.js?v=18', 'bg${i}.js?v=19')
          s = s.replace('<script src="series-series-pages-v2.js?v=1"></script>\n', '')
          s = s.replace('<script src="series-neighbors-v4.js?v=4"></script>\n', '')
          if 'series-neighbors-standalone-v5.js?v=5' not in s:
              anchor = '<script src="lookup-lock.js?v=1"></script>'
              if anchor not in s:
                  raise SystemExit('Anchor lookup-lock non trovato')
              s = s.replace(anchor, '<script src="series-neighbors-standalone-v5.js?v=5"></script>\n'+anchor, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('bg/bg8.js')
          s = p.read_text(encoding='utf-8')
          if 'isbn-cover.js?v=19' not in s and 'isbn-cover.js?v=20' not in s:
              raise SystemExit('Versione isbn-cover non trovata in bg8')
          s = s.replace('isbn-cover.js?v=19', 'isbn-cover.js?v=20')
          p.write_text(s, encoding='utf-8')
      - name: Verifica sintassi e collegamenti
        run: |
          node --check series-neighbors-standalone-v5.js
          node --check isbn-cover.js
          grep -F 'series-neighbors-standalone-v5.js?v=5' index.html
          grep -F 'bg${i}.js?v=19' index.html
          grep -F 'isbn-cover.js?v=20' bg/bg8.js
          grep -F '__LIB_RESOLVE_SERIES_NEIGHBORS' isbn-cover.js
          ! grep -F 'series-neighbors-v4.js' index.html
          ! grep -F 'series-series-pages-v2.js' index.html
      - name: Commit patch e rimuovi workflow temporaneo
        run: |
          rm -f .github/workflows/patch-series-neighbors-v5-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add isbn-cover.js index.html bg/bg8.js .github/workflows/patch-series-neighbors-v5-once.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Collega resolver standalone al flusso ISBN e forza cache v5'
          git push
