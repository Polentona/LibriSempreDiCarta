name: Supporto liste bibliografiche senza spazio v5
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-wikipedia-list-spacing-v5.yml'
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Applica correzione generale
        run: python tools/fix_wikipedia_list_spacing_v5.py
      - name: Verifica sintassi
        run: node --check series-universal-resolver-v1.js
      - name: Verifica bibliografie reali
        run: |
          node <<'JS'
          global.window=global;
          require('./series-universal-resolver-v1.js');
          const cases=[
            [{title:'La voce dei morti',author:'Simon Beckett'},{saga:'David Hunter',prequel:'I sussurri della morte',sequel:'Acque morte'}],
            [{title:'Torment',author:'Lauren Kate'},{saga:'Fallen',prequel:'Fallen',sequel:'Passion'}]
          ];
          (async()=>{
            for(const [input,exp] of cases){
              const r=await global.__LIB_RESOLVE_UNIVERSAL_SERIES(input);
              console.log('RELATION_TEST='+JSON.stringify({input,result:r}));
              if(!r)throw new Error('Nessun risultato per '+input.title);
              for(const k of ['saga','prequel','sequel'])if(String(r[k]||'')!==exp[k])throw new Error(`${input.title}: ${k}=${JSON.stringify(r[k])}; atteso ${JSON.stringify(exp[k])}`);
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Commit se i test passano
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add series-universal-resolver-v1.js index.html
          git commit -m "Accetta entrambe le sintassi delle liste bibliografiche"
          git push
