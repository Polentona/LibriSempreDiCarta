name: Corregge metadati libri e relazioni v2
on:
  push:
    paths:
      - 'tools/run_patch_general_metadata_safety_v2.py'
      - '.github/workflows/patch-general-metadata-safety-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Applica correzioni generali
        run: python tools/run_patch_general_metadata_safety_v2.py
      - name: Verifica filtri e cache bust
        run: |
          grep -q "function screenMediaNoise" italian-catalog-fallback-v3.js
          grep -q "const currentAuthors=(v.authors||\[\]).filter(validAuthor)" italian-catalog-fallback-v3.js
          grep -q "function screenMediaNoise" series-relations.js
          grep -q "continua|continuano|prosegue|proseguono" series-relations.js
          grep -q "function safeBookRelation" isbn-cover.js
          grep -q "italian-catalog-fallback-v3.js?v=13" bg/bg8.js
          grep -q "series-relations.js?v=7" bg/bg8.js
          grep -q "isbn-cover.js?v=24" bg/bg8.js
          grep -q 'bg${i}.js?v=24' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add italian-catalog-fallback-v3.js series-relations.js isbn-cover.js bg/bg8.js index.html
          git commit -m "Rende sicuri autore saga e relazioni bibliografiche"
          git push
