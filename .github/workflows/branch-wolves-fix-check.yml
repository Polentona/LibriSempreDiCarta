name: Verifica fix ISBN Wolves

on:
  push:
    branches: ['fix/isbn-wolves-genres-relations']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Controlla sintassi JavaScript
        run: |
          node --check storygraph-goodreads-genres-v3.js
          node --check series-neighbors-standalone-v5.js
      - name: Verifica parsing StoryGraph Fantasy e Horror
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          global.window=global;
          global.document={getElementById(){return null}};
          global.setInterval=()=>0;
          global.clearInterval=()=>{};
          global.setTimeout=()=>0;
          global.clearTimeout=()=>{};
          vm.runInThisContext(fs.readFileSync('storygraph-goodreads-genres-v3.js','utf8'));
          const got=window.__LIB_STORYGRAPH_GENRES_TEST__.storyGenresFromLine('fiction fantasy horror adventurous dark mysterious medium-paced');
          if(JSON.stringify(got)!==JSON.stringify(['Fantasy','Horror']))throw new Error('Generi inattesi: '+JSON.stringify(got));
          console.log('Generi:',got.join(', '));
          NODE
      - name: Verifica single owner e cache busting
        run: |
          grep -q "storygraph-goodreads-genres-v3.js?v=20260820-1" series-neighbors-standalone-v5.js
          grep -q "series-authoritative-runtime-v4.js?v=20260820-8" series-neighbors-standalone-v5.js
          grep -q "'isbn-cover.js'" .github/workflows/cache-bust-runtime-v1.yml
          grep -q "'isbn-cover.js':'20260820-relations-cache-1'" .github/workflows/cache-bust-runtime-v1.yml