name: Correzione copertine una tantum

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cover-fix-once.yml'

permissions:
  contents: write

jobs:
  fix-cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Salva la copertina verificata nel repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/covers
          URL1='https://m.media-amazon.com/images/I/51fUu9E5wOL.jpg'
          URL2='https://m.media-amazon.com/images/I/51fUu9E5wOL._SY445_SX342_.jpg'
          if ! curl -L --fail --retry 2 --connect-timeout 15 --max-time 60 -A 'Mozilla/5.0' "$URL1" -o assets/covers/9788854147317.jpg; then
            curl -L --fail --retry 2 --connect-timeout 15 --max-time 60 -A 'Mozilla/5.0' "$URL2" -o assets/covers/9788854147317.jpg
          fi
          test -s assets/covers/9788854147317.jpg

      - name: Corregge il recupero e forza l'aggiornamento della cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('italian-metadata.js')
          s = p.read_text(encoding='utf-8')
          old = "cover:'https://m.media-amazon.com/images/I/51fUu9E5wOL._SY445_SX342_.jpg',"
          new = "cover:'assets/covers/9788854147317.jpg',"
          if old in s:
              s = s.replace(old, new, 1)
          elif "cover:'assets/covers/9788854147317.jpg'," not in s:
              raise SystemExit('Riferimento copertina atteso non trovato')

          marker = "function coverImageCandidates(text,title=''){"
          helper = """function retailerSafeImage(url){\n  const u=String(url||'').trim();\n  if(!u)return '';\n  if(/^https?:\\/\\/(?:m\\.media-amazon\\.com|images(?:-na)?\\.ssl-images-amazon\\.com)\\//i.test(u)){\n    return 'https://images.weserv.nl/?url='+encodeURIComponent(u);\n  }\n  return u\n}\n"""
          if helper not in s:
              if marker not in s:
                  raise SystemExit('Punto inserimento helper non trovato')
              s = s.replace(marker, helper + marker, 1)

          s = s.replace("const amazon=await coverFromRetailPage(`https://www.amazon.it/dp/${encodeURIComponent(i10)}`,n,title);if(amazon)return amazon", "const amazon=await coverFromRetailPage(`https://www.amazon.it/dp/${encodeURIComponent(i10)}`,n,title);if(amazon)return retailerSafeImage(amazon)")
          s = s.replace("const image=await coverFromRetailPage(url,n,title);if(image)return image", "const image=await coverFromRetailPage(url,n,title);if(image)return retailerSafeImage(image)")
          p.write_text(s, encoding='utf-8')

          bg8 = Path('bg/bg8.js')
          t = bg8.read_text(encoding='utf-8')
          t = t.replace("italian-metadata.js?v=2", "italian-metadata.js?v=8")
          bg8.write_text(t, encoding='utf-8')

          index = Path('index.html')
          h = index.read_text(encoding='utf-8')
          h = h.replace("bg${i}.js?v=4", "bg${i}.js?v=5")
          index.write_text(h, encoding='utf-8')
          PY

      - name: Commit della correzione
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/covers/9788854147317.jpg italian-metadata.js bg/bg8.js index.html
          if git diff --cached --quiet; then
            echo 'Nessuna modifica da salvare.'
            exit 0
          fi
          git commit -m 'Rende affidabile la copertina da Amazon e Bancolibri'
          git push origin HEAD:main
