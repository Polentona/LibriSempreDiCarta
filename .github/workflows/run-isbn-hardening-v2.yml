name: Esegui patch robustezza ISBN v2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/run-isbn-hardening-v2.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 tools/patch_isbn_hardening_v2.py
      - run: |
          node --check italian-catalog-fallback-v3.js
          node --check isbn-resilient-fallback-v1.js
          node --check series-authoritative-catalog-v1.js
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add italian-catalog-fallback-v3.js isbn-resilient-fallback-v1.js series-authoritative-catalog-v1.js bg/bg8.js index.html
          git commit -m 'Rendi robusto il recupero ISBN e blocca pagine generiche'
          git push
