name: Correzione generale ricerca copertine

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-universal-covers-once.yml'

permissions:
  contents: write

jobs:
  fix-universal-covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Applica ricerca copertine a tutti gli ISBN
        run: python fix_universal_covers.py

      - name: Salva le modifiche
        run: |
          git rm .github/workflows/fix-universal-covers-once.yml fix_universal_covers.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add isbn-cover.js bg/bg8.js
          git commit -m "Applica la ricerca copertine italiana a tutti gli ISBN"
          git push origin main
