name: Integra lookup universale ISBN e saghe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-universal-lookup-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Applica patch
        run: python tools/patch_universal_lookup_v1.py
      - name: Verifica JavaScript
        run: |
          node --check isbn-resilient-fallback-v1.js
          node --check series-universal-resolver-v1.js
          node --check isbn-cover.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add isbn-resilient-fallback-v1.js series-universal-resolver-v1.js isbn-cover.js index.html
          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare"
          else
            git commit -m "Integra ricerca universale ISBN e saghe"
            git push
          fi
