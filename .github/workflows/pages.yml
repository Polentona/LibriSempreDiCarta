name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - ".github/**"
      - "tools/**"
      - "scripts/**"
      - "deploy-*.txt"
      - "*-result.txt"
      - "actions-probe-trigger.txt"
      - "_fast-test-trigger.txt"
      - "_single-owner-test-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Forza cache runtime nell'artefatto
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('index.html'); s=p.read_text(encoding='utf-8'); version=os.environ['GITHUB_SHA'][:12]
          targets=['isbn-resilient-fallback-v1.js','series-bounded-resolver-v1.js','series-relations-direct-v7.js','series-wikipedia-authoritative-v3.js','series-google-books-order-v10.js','series-authoritative-catalog-v1.js','series-neighbors-standalone-v5.js','series-universal-resolver-v1.js','isbn-cover.js','lookup-lock.js']
          changed=[]
          for filename in targets:
              pattern=re.escape(filename)+r'\?v=[^"\']+'
              if re.search(pattern,s):
                  s=re.sub(pattern,filename+'?v='+version,s); changed.append(filename)
          p.write_text(s,encoding='utf-8')
          print('CACHE_VERSION='+version); print('CACHE_TARGETS='+','.join(changed))
          if 'series-neighbors-standalone-v5.js' not in changed or 'isbn-cover.js' not in changed: raise SystemExit('Runtime critici non trovati')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verifica HTML e runtime pubblicati
        id: live
        continue-on-error: true
        run: |
          ok=0; runtime=0; bytes=0; token="${GITHUB_SHA::12}"
          for i in $(seq 1 20); do
            if curl -fsSL --max-time 20 "https://polentona.github.io/LibriSempreDiCarta/?pages-live=${GITHUB_RUN_ID}-${i}" -o /tmp/pages-live.html; then
              bytes=$(wc -c </tmp/pages-live.html)
              if grep -q 'id="addBookBtn"' /tmp/pages-live.html \
                && grep -Fq "series-neighbors-standalone-v5.js?v=${token}" /tmp/pages-live.html \
                && grep -Fq "isbn-cover.js?v=${token}" /tmp/pages-live.html \
                && curl -fsSL --max-time 20 "https://polentona.github.io/LibriSempreDiCarta/series-neighbors-standalone-v5.js?runtime=${GITHUB_RUN_ID}-${i}" -o /tmp/loader-live.js \
                && grep -q '__LIB_SERIES_NEIGHBORS_STANDALONE_V54' /tmp/loader-live.js \
                && grep -q 'goodreads-primary-metadata-v1.js?v=20260820-1' /tmp/loader-live.js \
                && grep -q 'storygraph-genre-lock-v4.js?v=20260820-3' /tmp/loader-live.js \
                && grep -q 'goodreads-primary-then-storygraph-then-fallback-v1' /tmp/loader-live.js \
                && grep -q 'goodreads-primary-physical-italian-then-storygraph-v1' /tmp/loader-live.js \
                && grep -q 'goodreads-italian-primary-then-storygraph-translated-v1' /tmp/loader-live.js \
                && curl -fsSL --max-time 20 "https://polentona.github.io/LibriSempreDiCarta/goodreads-primary-metadata-v1.js?runtime=${GITHUB_RUN_ID}-${i}" -o /tmp/primary-live.js \
                && grep -q '__LIB_GOODREADS_PRIMARY_METADATA_V1' /tmp/primary-live.js \
                && grep -q 'goodreads.com/search' /tmp/primary-live.js \
                && grep -q 'thestorygraph.com/browse' /tmp/primary-live.js \
                && ! grep -q 'it.wikipedia.org' /tmp/primary-live.js \
                && curl -fsSL --max-time 20 "https://polentona.github.io/LibriSempreDiCarta/storygraph-genre-lock-v4.js?runtime=${GITHUB_RUN_ID}-${i}" -o /tmp/genre-lock-live.js \
                && grep -q '__LIB_STORYGRAPH_GENRE_LOCK_V6' /tmp/genre-lock-live.js; then
                runtime=1; ok=1; break
              fi
            fi
            sleep 5
          done
          echo "HTML_OK=$ok" | tee /tmp/pages-result.log
          echo "RUNTIME_OK=$runtime" | tee -a /tmp/pages-result.log
          echo "HTML_BYTES=$bytes" | tee -a /tmp/pages-result.log
          echo "CACHE_TOKEN=$token" | tee -a /tmp/pages-result.log
          test "$ok" = 1; test "$runtime" = 1
      - name: Registra risultato Pages
        if: always()
        continue-on-error: true
        run: |
          git reset --hard
          git fetch origin main
          git checkout -B main origin/main
          {
            echo "deploy=${{ steps.deployment.outcome }}"
            echo "html=${{ steps.live.outcome }}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
            echo '---'
            cat /tmp/pages-result.log 2>/dev/null || true
          } > pages-deploy-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-deploy-result.txt
          git commit -m "Registra esito deploy GitHub Pages" || exit 0
          git push origin HEAD:main || echo "::warning::Esito Pages non registrato perché main è avanzato durante il deploy."
      - name: Fallisci se la verifica live non passa
        if: steps.deployment.outcome != 'success' || steps.live.outcome != 'success'
        run: exit 1
