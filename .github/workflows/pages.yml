name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - ".github/**"
      - "tools/**"
      - "scripts/**"
      - "deploy-*.txt"
      - "*-result.txt"
      - "actions-probe-trigger.txt"
      - "_fast-test-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verifica HTML e runtime pubblicati
        id: live
        continue-on-error: true
        run: |
          ok=0
          runtime=0
          bytes=0
          for i in $(seq 1 18); do
            if curl -fsSL --max-time 20 "https://polentona.github.io/LibriSempreDiCarta/?pages-live=${GITHUB_RUN_ID}-${i}" -o /tmp/pages-live.html; then
              bytes=$(wc -c </tmp/pages-live.html)
              if grep -q 'id="editInLibrary"' /tmp/pages-live.html \
                && grep -q "currentView='home'" /tmp/pages-live.html \
                && grep -q 'data-author-letter' /tmp/pages-live.html \
                && grep -q 'class="series-row"' /tmp/pages-live.html \
                && grep -q 'id="addBookBtn"' /tmp/pages-live.html \
                && grep -q 'series-authoritative-catalog-v1.js?v=6' /tmp/pages-live.html \
                && grep -q 'series-neighbors-standalone-v5.js?v=20260820-35' /tmp/pages-live.html; then
                if curl -fsSL --max-time 20 "https://polentona.github.io/LibriSempreDiCarta/series-neighbors-standalone-v5.js?runtime=${GITHUB_RUN_ID}-${i}" -o /tmp/loader-live.js \
                  && grep -q '__LIB_SERIES_NEIGHBORS_STANDALONE_V38' /tmp/loader-live.js \
                  && grep -q 'series-verified-order-v1.js?v=20260820-1' /tmp/loader-live.js \
                  && ! grep -q 'series-dark-tower-authoritative-v1.js' /tmp/loader-live.js \
                  && curl -fsSL --max-time 20 "https://polentona.github.io/LibriSempreDiCarta/series-verified-order-v1.js?runtime=${GITHUB_RUN_ID}-${i}" -o /tmp/series-live.js \
                  && grep -q '__LIB_VERIFIED_SERIES_ORDER_V1' /tmp/series-live.js \
                  && grep -q 'verified-ordered-source-only' /tmp/series-live.js \
                  && ! grep -q '9788868363710' /tmp/series-live.js \
                  && ! grep -q 'Stephen King' /tmp/series-live.js \
                  && ! grep -q 'La Torre Nera' /tmp/series-live.js \
                  && curl -fsSL --max-time 20 "https://polentona.github.io/LibriSempreDiCarta/series-authoritative-catalog-v1.js?runtime=${GITHUB_RUN_ID}-${i}" -o /tmp/catalog-live.js \
                  && grep -q 'no-hardcoded-relations' /tmp/catalog-live.js \
                  && curl -fsSL --max-time 20 "https://polentona.github.io/LibriSempreDiCarta/publisher-plot-resilience-v7.js?runtime=${GITHUB_RUN_ID}-${i}" -o /tmp/plot-live.js \
                  && grep -q '__LIB_PUBLISHER_PLOT_RESILIENCE_V7' /tmp/plot-live.js \
                  && grep -q 'privacyNoise' /tmp/plot-live.js; then
                  runtime=1
                  ok=1
                  break
                fi
              fi
            fi
            sleep 5
          done
          echo "HTML_OK=$ok" | tee /tmp/pages-result.log
          echo "RUNTIME_OK=$runtime" | tee -a /tmp/pages-result.log
          echo "HTML_BYTES=$bytes" | tee -a /tmp/pages-result.log
          test "$ok" = 1
          test "$runtime" = 1
      - name: Registra risultato Pages
        if: always()
        run: |
          {
            echo "deploy=${{ steps.deployment.outcome }}"
            echo "html=${{ steps.live.outcome }}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
            echo "---"
            cat /tmp/pages-result.log 2>/dev/null || true
          } > pages-deploy-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add pages-deploy-result.txt
          git commit -m "Registra esito deploy GitHub Pages" || exit 0
          git push
      - name: Fallisci se la verifica live non passa
        if: steps.deployment.outcome != 'success' || steps.live.outcome != 'success'
        run: exit 1
