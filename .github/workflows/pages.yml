name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - ".github/**"
      - "tools/**"
      - "scripts/**"
      - "deploy-*.txt"
      - "*-result.txt"
      - "actions-probe-trigger.txt"
      - "_fast-test-trigger.txt"
      - "_single-owner-test-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Forza cache runtime nell'artefatto
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          version=os.environ['GITHUB_SHA'][:12]
          targets=[
            'isbn-resilient-fallback-v1.js',
            'series-bounded-resolver-v1.js',
            'series-relations-direct-v7.js',
            'series-wikipedia-authoritative-v3.js',
            'series-google-books-order-v10.js',
            'series-authoritative-catalog-v1.js',
            'series-neighbors-standalone-v5.js',
            'series-universal-resolver-v1.js',
            'isbn-cover.js',
            'lookup-lock.js'
          ]
          changed=[]
          for filename in targets:
              pattern=re.escape(filename)+r'\?v=[^"\']+'
              if re.search(pattern,s):
                  s=re.sub(pattern,filename+'?v='+version,s)
                  changed.append(filename)
          p.write_text(s,encoding='utf-8')
          print('CACHE_VERSION='+version)
          print('CACHE_TARGETS='+','.join(changed))
          if 'series-neighbors-standalone-v5.js' not in changed or 'isbn-cover.js' not in changed:
              raise SystemExit('Runtime critici non trovati in index.html')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verifica HTML e runtime pubblicati
        id: live
        continue-on-error: true
        run: |
          ok=0
          runtime=0
          bytes=0
          token="${GITHUB_SHA::12}"
          for i in $(seq 1 18); do
            if curl -fsSL --max-time 20 "https://polentona.github.io/LibriSempreDiCarta/?pages-live=${GITHUB_RUN_ID}-${i}" -o /tmp/pages-live.html; then
              bytes=$(wc -c </tmp/pages-live.html)
              if grep -q 'id="editInLibrary"' /tmp/pages-live.html \
                && grep -q "currentView='home'" /tmp/pages-live.html \
                && grep -q 'data-author-letter' /tmp/pages-live.html \
                && grep -q 'class="series-row"' /tmp/pages-live.html \
                && grep -q 'id="addBookBtn"' /tmp/pages-live.html \
                && grep -Fq "series-neighbors-standalone-v5.js?v=${token}" /tmp/pages-live.html \
                && grep -Fq "isbn-cover.js?v=${token}" /tmp/pages-live.html; then
                if curl -fsSL --max-time 20 "https://polentona.github.io/LibriSempreDiCarta/series-neighbors-standalone-v5.js?runtime=${GITHUB_RUN_ID}-${i}" -o /tmp/loader-live.js \
                  && grep -q '__LIB_SERIES_NEIGHBORS_STANDALONE_V48' /tmp/loader-live.js \
                  && grep -q '__LIB_GOODREADS_GENRES_LOADER_V1=true' /tmp/loader-live.js \
                  && grep -q '__LIB_GOODREADS_GENRES_ONLY_V10=true' /tmp/loader-live.js \
                  && grep -q '__LIB_GENRE_OPENLIBRARY_WORK_V1=true' /tmp/loader-live.js \
                  && grep -q '__LIB_GENRE_SEARCH_FALLBACK_V2=true' /tmp/loader-live.js \
                  && grep -q 'series-authoritative-runtime-v7.js?v=20260820-11' /tmp/loader-live.js \
                  && grep -q 'series-relation-stabilizer-v8.js?v=20260820-1' /tmp/loader-live.js \
                  && grep -q 'series-single-owner-guard-v1.js?v=20260820-6' /tmp/loader-live.js \
                  && grep -q 'publisher-plot-lock-v8.js?v=20260820-11' /tmp/loader-live.js \
                  && grep -q 'isbn-field-sanitizer-v2.js?v=20260820-2' /tmp/loader-live.js \
                  && grep -q 'storygraph-goodreads-genres-v3.js?v=20260820-1' /tmp/loader-live.js \
                  && grep -q 'goodreads-order-canonical-localization-stable-v8' /tmp/loader-live.js \
                  && ! grep -q 'series-authoritative-runtime-v6.js' /tmp/loader-live.js \
                  && ! grep -q 'isbn-field-sanitizer-v1.js' /tmp/loader-live.js \
                  && ! grep -q 'series-verified-order-v1.js' /tmp/loader-live.js \
                  && ! grep -q 'series-verified-order-v2.js' /tmp/loader-live.js \
                  && ! grep -q 'series-verified-saga-v3.js' /tmp/loader-live.js \
                  && ! grep -q 'genre-whitelist-enforcer-v2.js' /tmp/loader-live.js \
                  && curl -fsSL --max-time 20 "https://polentona.github.io/LibriSempreDiCarta/series-authoritative-runtime-v7.js?runtime=${GITHUB_RUN_ID}-${i}" -o /tmp/series-live.js \
                  && grep -q '__LIB_SERIES_AUTHORITATIVE_RUNTIME_V7' /tmp/series-live.js \
                  && grep -q 'goodreads-ordered-series-primary-v7' /tmp/series-live.js \
                  && ! grep -q '9788845279553' /tmp/series-live.js \
                  && ! grep -q 'Simon Beckett' /tmp/series-live.js \
                  && ! grep -q 'David Hunter' /tmp/series-live.js \
                  && ! grep -q '9788868363697' /tmp/series-live.js \
                  && ! grep -q '9788868363710' /tmp/series-live.js \
                  && ! grep -q 'Stephen King' /tmp/series-live.js \
                  && ! grep -q 'La Torre Nera' /tmp/series-live.js \
                  && ! grep -q 'Alexandra Adornetto' /tmp/series-live.js \
                  && ! grep -q 'Sacrifice' /tmp/series-live.js \
                  && curl -fsSL --max-time 20 "https://polentona.github.io/LibriSempreDiCarta/series-relation-stabilizer-v8.js?runtime=${GITHUB_RUN_ID}-${i}" -o /tmp/stabilizer-live.js \
                  && grep -q '__LIB_SERIES_RELATION_STABILIZER_V8' /tmp/stabilizer-live.js \
                  && grep -q '__LIB_SERIES_AUTHORITATIVE_RUNTIME_V8' /tmp/stabilizer-live.js \
                  && grep -q 'canonical-title-localizer-v8' /tmp/stabilizer-live.js \
                  && grep -q 'goodreads-order-canonical-localization-stable-v8' /tmp/stabilizer-live.js \
                  && ! grep -q '9788845279553' /tmp/stabilizer-live.js \
                  && ! grep -q 'Simon Beckett' /tmp/stabilizer-live.js \
                  && ! grep -q 'David Hunter' /tmp/stabilizer-live.js \
                  && curl -fsSL --max-time 20 "https://polentona.github.io/LibriSempreDiCarta/isbn-field-sanitizer-v2.js?runtime=${GITHUB_RUN_ID}-${i}" -o /tmp/sanitizer-live.js \
                  && grep -q '__LIB_ISBN_FIELD_SANITIZER_V2' /tmp/sanitizer-live.js \
                  && grep -q '__LIB_CLEAN_PUBLISHER' /tmp/sanitizer-live.js \
                  && grep -q '__LIB_CLEAN_AUTOMATIC_PLOT' /tmp/sanitizer-live.js \
                  && curl -fsSL --max-time 20 "https://polentona.github.io/LibriSempreDiCarta/storygraph-goodreads-genres-v3.js?runtime=${GITHUB_RUN_ID}-${i}" -o /tmp/genre-live.js \
                  && grep -q '__LIB_STORYGRAPH_GOODREADS_GENRES_V3' /tmp/genre-live.js \
                  && grep -q 'storygraph-direct-then-goodreads-only-if-absent-v3' /tmp/genre-live.js \
                  && grep -q "'fantasy':'Fantasy'" /tmp/genre-live.js \
                  && grep -q "'horror':'Horror'" /tmp/genre-live.js \
                  && curl -fsSL --max-time 20 "https://polentona.github.io/LibriSempreDiCarta/publisher-plot-lock-v8.js?runtime=${GITHUB_RUN_ID}-${i}" -o /tmp/plot-live.js \
                  && grep -q '__LIB_PUBLISHER_PLOT_LOCK_V8' /tmp/plot-live.js \
                  && grep -q '__LIB_PUBLISHER_PLOT_LOCK_V8_LATE_RESOLVER' /tmp/plot-live.js \
                  && grep -q '__LIB_PUBLISHER_PLOT_LOCK_V8_SANITIZED' /tmp/plot-live.js; then
                  runtime=1
                  ok=1
                  break
                fi
              fi
            fi
            sleep 5
          done
          echo "HTML_OK=$ok" | tee /tmp/pages-result.log
          echo "RUNTIME_OK=$runtime" | tee -a /tmp/pages-result.log
          echo "HTML_BYTES=$bytes" | tee -a /tmp/pages-result.log
          echo "CACHE_TOKEN=$token" | tee -a /tmp/pages-result.log
          test "$ok" = 1
          test "$runtime" = 1
      - name: Registra risultato Pages
        if: always()
        continue-on-error: true
        run: |
          git reset --hard
          git fetch origin main
          git checkout -B main origin/main
          {
            echo "deploy=${{ steps.deployment.outcome }}"
            echo "html=${{ steps.live.outcome }}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
            echo '---'
            cat /tmp/pages-result.log 2>/dev/null || true
          } > pages-deploy-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-deploy-result.txt
          git commit -m "Registra esito deploy GitHub Pages" || exit 0
          git push origin HEAD:main || echo "::warning::Esito Pages non registrato perché main è avanzato durante il deploy."
      - name: Fallisci se la verifica live non passa
        if: steps.deployment.outcome != 'success' || steps.live.outcome != 'success'
        run: exit 1
