name: Verifica avvio GitHub Actions

on:
  push:
    branches: ["main"]
    paths:
      - "actions-probe-trigger.txt"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Registra avvio Actions
        run: |
          {
            echo "status=started"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
          } > actions-probe-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add actions-probe-result.txt
          git commit -m "Registra avvio GitHub Actions"
          git push
