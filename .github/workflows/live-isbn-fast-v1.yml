name: Test ISBN live rapido

on:
  push:
    branches: [main]
    paths:
      - '_fast-test-trigger.txt'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test live trama editore
        id: live
        continue-on-error: true
        run: |
          node --check publisher-plot-priority-v3.js
          mkdir -p /tmp/isbn-fast && cd /tmp/isbn-fast
          npm init -y >/dev/null 2>&1
          npm install playwright-core@1.55.0 >/dev/null 2>&1
          cat > test.js <<'JS'
          const {chromium}=require('playwright-core');
          const expected={title:'Il valzer lento delle tartarughe',author:'Katherine Pancol',publisher:'Bompiani',year:'2015'};
          const norm=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
          const same=(a,b)=>norm(a)===norm(b);
          const read=page=>page.evaluate(()=>({title:editTitle?.value||'',author:editAuthor?.value||'',publisher:editPublisher?.value||'',publishedDate:editPublishedDate?.value||'',plot:editPlot?.value||'',status:lookupStatus?.innerText||'',loaderV30:!!window.__LIB_SERIES_NEIGHBORS_STANDALONE_V30,plotV3:!!window.__LIB_PUBLISHER_PLOT_PRIORITY_V3,plotPolicy:window.__LIB_PLOT_SOURCE_POLICY||''}));
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1400,height:1100}});page.on('pageerror',e=>console.log('PAGE_ERROR',e.message));page.on('response',r=>{if(r.status()>=400)console.log('HTTP',r.status(),r.url())});
            await page.goto('https://polentona.github.io/LibriSempreDiCarta/?fast-plot='+Date.now(),{waitUntil:'domcontentloaded',timeout:90000});
            await page.locator('#addBookBtn').click();await page.locator('#editDialog[open]').waitFor({timeout:15000});await page.locator('#editCode').fill('9788845278389');await page.locator('#lookupMetadataBtn').click();
            let last={};const until=Date.now()+90000;while(Date.now()<until){await page.waitForTimeout(1000);last=await read(page);if(same(last.title,expected.title)&&same(last.author,expected.author)&&same(last.publisher,expected.publisher)&&String(last.publishedDate).includes(expected.year)&&last.loaderV30&&last.plotV3&&last.plot.length>=200)break}
            const official=await page.evaluate(async()=>typeof window.__LIB_RESOLVE_OFFICIAL_PLOT==='function'?await window.__LIB_RESOLVE_OFFICIAL_PLOT({code:'9788845278389',title:editTitle?.value||'',author:editAuthor?.value||'',publisher:editPublisher?.value||''}):'');
            console.log('FINAL',JSON.stringify({...last,plot:last.plot.slice(0,160)+'…',officialLength:official.length}));
            const bad=[];for(const k of ['title','author','publisher'])if(!same(last[k],expected[k]))bad.push(k);if(!String(last.publishedDate).includes(expected.year))bad.push('year');if(!last.loaderV30)bad.push('loader-v30');if(!last.plotV3)bad.push('plot-v3');if(last.plotPolicy!=='publisher-first-then-clean-fallbacks')bad.push('plot-policy');if(official.length<200)bad.push('official-plot');if(!same(last.plot,official))bad.push('official-plot-not-prioritized');if(/a mio parere|secondo me|verified purchase|serie tv|adattamento cinematograf|netflix|prime video/i.test(last.plot))bad.push('plot-noise');await browser.close();if(bad.length)throw new Error(bad.join(', '));console.log('FAST_PLOT_OK')
          })().catch(e=>{console.error('FAST_PLOT_FAIL',e.stack||e.message);process.exit(1)});
          JS
          node test.js 2>&1 | tee /tmp/isbn-fast.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Registra risultato
        if: always()
        run: |
          {
            echo "outcome=${{ steps.live.outcome }}"
            echo "source_commit=${GITHUB_SHA}"
            echo "mode=publisher-plot-v3"
            echo '---'
            cat /tmp/isbn-fast.log 2>/dev/null || true
          } > live-isbn-fast-result.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || true
          git add live-isbn-fast-result.txt
          git commit -m 'Registra test ISBN rapido' || exit 0
          git push
      - name: Fallisci se test KO
        if: steps.live.outcome != 'success'
        run: exit 1
