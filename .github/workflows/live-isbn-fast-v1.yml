name: Test ISBN live rapido

on:
  push:
    branches: [main]
    paths:
      - '_fast-test-trigger.txt'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test live completo ISBN 9788868363710
        id: live
        continue-on-error: true
        run: |
          node --check series-verified-order-v1.js
          node --check series-authoritative-catalog-v1.js
          node --check series-neighbors-standalone-v5.js
          node --check publisher-plot-resilience-v7.js
          ! grep -q '9788868363710' series-verified-order-v1.js
          ! grep -q 'Stephen King' series-verified-order-v1.js
          ! grep -q 'La Torre Nera' series-verified-order-v1.js
          mkdir -p /tmp/isbn-fast && cd /tmp/isbn-fast
          npm init -y >/dev/null 2>&1
          npm install playwright-core@1.55.0 >/dev/null 2>&1
          cat > test.js <<'JS'
          const {chromium}=require('playwright-core');
          const ISBN='9788868363710';
          const EXPECTED={
            title:'I lupi del Calla. La torre nera (Vol. 5)',
            author:'Stephen King',
            publisher:'Sperling & Kupfer',
            year:'2017',
            genres:['Fantasy','Horror'],
            saga:'La Torre Nera',
            prequel:'La sfera del buio',
            sequel:'La canzone di Susannah'
          };
          const norm=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
          const same=(a,b)=>norm(a)===norm(b);
          const titleCore=v=>norm(v).replace(/\b(?:vol|volume)\s*5\b/g,' ').replace(/\s+/g,' ').trim();
          const sameTitle=(a,b)=>titleCore(a)===titleCore(b);
          const genreSet=v=>new Set(String(v||'').split(/[,;|]/).map(x=>norm(x)).filter(Boolean));
          const exactGenres=v=>{const got=genreSet(v),exp=new Set(EXPECTED.genres.map(norm));return got.size===exp.size&&[...exp].every(x=>got.has(x))};
          const privacy=v=>/per quanto riguarda la pubblicita|terze parti selezionate|dati di geolocalizzazione|caratteristiche del dispositivo|annunci e contenuti personalizzati|consenso cookie|cookie policy/i.test(norm(v));
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1400,height:1100}});
            page.on('pageerror',e=>console.log('PAGE_ERROR',e.message));
            page.on('response',r=>{if(r.status()>=400&&!r.url().includes('googleapis.com/books/v1/volumes'))console.log('HTTP',r.status(),r.url())});

            // Google Books viene spesso limitato in GitHub Actions. Mockiamo soltanto
            // i metadati bibliografici dell'edizione: generi, relazioni di saga, trama
            // editore e logica dell'app restano quelli del sito LIVE.
            await page.route('**://www.googleapis.com/books/v1/volumes**',async route=>{
              const u=new URL(route.request().url()),q=u.searchParams.get('q')||'';
              if(!q.includes(ISBN)){await route.continue();return}
              const body={kind:'books#volumes',totalItems:1,items:[{
                id:'GeGoswEACAAJ',
                volumeInfo:{
                  title:EXPECTED.title,authors:[EXPECTED.author],publisher:EXPECTED.publisher,publishedDate:EXPECTED.year,
                  industryIdentifiers:[{type:'ISBN_13',identifier:ISBN},{type:'ISBN_10',identifier:'8868363712'}],
                  imageLinks:{thumbnail:'https://books.google.com/books/content?id=GeGoswEACAAJ&printsec=frontcover&img=1&zoom=1&source=gbs_api'}
                }
              }]};
              await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(body)});
            });

            await page.goto('https://polentona.github.io/LibriSempreDiCarta/?test-all-fields-generic='+Date.now(),{waitUntil:'domcontentloaded',timeout:90000});
            await page.locator('#addBookBtn').click();
            await page.locator('#editDialog[open]').waitFor({timeout:15000});
            await page.locator('#editCode').fill(ISBN);
            await page.locator('#lookupMetadataBtn').click();

            const ids=['editCode','editTitle','editAuthor','editPublisher','editPublishedDate','editCategory','editSaga','editPrequel','editSequel','editPlot','editCover'];
            let current={},metadataChoiceSeen=false,coverChoiceSeen=false;
            const until=Date.now()+110000;
            while(Date.now()<until){
              await page.waitForTimeout(700);
              const metas=page.locator('#metadataOverlay[open] .metadata-choice');
              if(await metas.count()){
                metadataChoiceSeen=true;
                const texts=await metas.allTextContents();
                let idx=texts.findIndex(t=>norm(t).includes('stephen king')&&norm(t).includes('sperling'));
                if(idx<0)idx=texts.findIndex(t=>norm(t).includes('stephen king'));
                if(idx<0)idx=0;
                await metas.nth(idx).click().catch(()=>{});
                await page.waitForTimeout(700);
              }
              const covers=page.locator('#metadataOverlay[open] .cover-choice');
              if(await covers.count()){
                coverChoiceSeen=true;
                await covers.first().click().catch(()=>{});
                await page.waitForTimeout(500);
              }
              current=await page.evaluate(ids=>Object.fromEntries(ids.map(id=>[id,document.getElementById(id)?.value||''])),ids);
              const allCore=sameTitle(current.editTitle,EXPECTED.title)&&same(current.editAuthor,EXPECTED.author)&&same(current.editPublisher,EXPECTED.publisher)
                && String(current.editPublishedDate).includes(EXPECTED.year)&&exactGenres(current.editCategory)
                && same(current.editSaga,EXPECTED.saga)&&same(current.editPrequel,EXPECTED.prequel)&&same(current.editSequel,EXPECTED.sequel);
              const plotOk=current.editPlot.length>=500&&!privacy(current.editPlot)&&/^rumore di passi sul sentiero del vettore/i.test(current.editPlot.trim());
              if(allCore&&plotOk&&(current.editCover||coverChoiceSeen))break;
            }

            await page.waitForTimeout(3000);
            current=await page.evaluate(ids=>Object.fromEntries(ids.map(id=>[id,document.getElementById(id)?.value||''])),ids);

            const state=await page.evaluate(async({ISBN,EXPECTED})=>{
              const input={code:ISBN,title:document.getElementById('editTitle')?.value||EXPECTED.title,author:document.getElementById('editAuthor')?.value||EXPECTED.author,publisher:document.getElementById('editPublisher')?.value||EXPECTED.publisher,saga:document.getElementById('editSaga')?.value||EXPECTED.saga};
              let rel=null,verified=null,compat=null,official='';
              try{rel=await window.__LIB_RESOLVE_SERIES_NEIGHBORS?.(input)}catch(e){rel={error:String(e)}}
              try{verified=await window.__LIB_RESOLVE_VERIFIED_SERIES_NEIGHBORS?.(input)}catch(e){verified={error:String(e)}}
              try{compat=await window.__LIB_RESOLVE_AUTHORITATIVE_SERIES_NEIGHBORS?.(input)}catch(e){compat={error:String(e)}}
              try{official=await window.__LIB_RESOLVE_OFFICIAL_PLOT?.(input)||''}catch(e){official='__ERROR__'+String(e)}
              let genericSource='';
              try{genericSource=await (await fetch('series-verified-order-v1.js?generic-check='+Date.now(),{cache:'no-store'})).text()}catch(e){}
              return {
                rel,verified,compat,official,
                loaderV38:!!window.__LIB_SERIES_NEIGHBORS_STANDALONE_V38,
                verifiedV1:!!window.__LIB_VERIFIED_SERIES_ORDER_V1,
                seriesPolicy:window.__LIB_SERIES_RELATION_POLICY||'',
                catalogPolicy:window.__LIB_SERIES_CATALOG_POLICY||'',
                noBookSpecificCode:!!genericSource&&!genericSource.includes(ISBN)&&!genericSource.includes(EXPECTED.author)&&!genericSource.includes(EXPECTED.saga),
                plotV7:!!window.__LIB_PUBLISHER_PLOT_RESILIENCE_V7,
                plotDeployMarker:window.__LIB_PLOT_V7_DEPLOY_MARKER||'',
                genrePolicy:window.__LIB_GENRE_SOURCE_POLICY||'',
                plotPolicy:window.__LIB_PLOT_SOURCE_POLICY||'',
                genreLast:window.__LIB_GENRE_WHITELIST_LAST__||null,
                verifiedDiag:window.__LIB_VERIFIED_SERIES_LAST__||null,
                exactCover:window.__LIB_EXACT_EAN_COVER__||null,
                coverQuality:window.__LIB_LAST_COVER_QUALITY__||null
              };
            },{ISBN,EXPECTED});
            const status=await page.locator('#lookupStatus').innerText();
            console.log('FINAL',JSON.stringify({current,status,metadataChoiceSeen,coverChoiceSeen,state:{...state,officialLength:state.official.length,officialPreview:state.official.slice(0,180)}}));

            const bad=[];
            if(!state.loaderV38)bad.push('loader-v38');
            if(!state.verifiedV1)bad.push('verified-series-runtime');
            if(state.seriesPolicy!=='verified-ordered-source-only')bad.push('series-policy:'+state.seriesPolicy);
            if(state.catalogPolicy!=='no-hardcoded-relations')bad.push('catalog-policy:'+state.catalogPolicy);
            if(!state.noBookSpecificCode)bad.push('book-specific-production-code');
            if(!state.plotV7||state.plotDeployMarker!=='20260820-all-fields')bad.push('plot-v7');
            if(state.plotPolicy!=='publisher-first-sperling-direct-v7-official-lock')bad.push('plot-policy');
            if(!same(current.editCode,ISBN))bad.push('isbn');
            if(!sameTitle(current.editTitle,EXPECTED.title))bad.push('title:'+current.editTitle);
            if(!same(current.editAuthor,EXPECTED.author))bad.push('author');
            if(!same(current.editPublisher,EXPECTED.publisher))bad.push('publisher');
            if(!String(current.editPublishedDate).includes(EXPECTED.year))bad.push('year');
            if(!exactGenres(current.editCategory))bad.push('genres:'+current.editCategory);
            if(!same(current.editSaga,EXPECTED.saga))bad.push('saga:'+current.editSaga);
            if(!same(current.editPrequel,EXPECTED.prequel))bad.push('prequel:'+current.editPrequel);
            if(!same(current.editSequel,EXPECTED.sequel))bad.push('sequel:'+current.editSequel);
            if(/during his|chancellor|the shining/i.test(current.editPrequel+' '+current.editSequel))bad.push('relation-garbage');
            if(!state.verified||!state.verified.verified||!same(state.verified.prequel,EXPECTED.prequel)||!same(state.verified.sequel,EXPECTED.sequel))bad.push('generic-verified-relations');
            if(!state.rel||!same(state.rel.prequel,EXPECTED.prequel)||!same(state.rel.sequel,EXPECTED.sequel))bad.push('runtime-relations');
            if(!state.compat||!same(state.compat.prequel,EXPECTED.prequel)||!same(state.compat.sequel,EXPECTED.sequel))bad.push('compat-relations');
            if((current.editPlot||'').length<500)bad.push('plot');
            if(privacy(current.editPlot))bad.push('privacy-text-in-plot');
            if(!/^rumore di passi sul sentiero del vettore/i.test(current.editPlot.trim()))bad.push('wrong-plot-section');
            if(/uno degli autori piu influenti e amati/i.test(norm(current.editPlot)))bad.push('author-bio-in-plot');
            if(!current.editCover&&!coverChoiceSeen)bad.push('cover');
            if(String(state.official||'').startsWith('__ERROR__')||(state.official||'').length<500)bad.push('official-plot');
            if(state.official&&!same(current.editPlot,state.official))bad.push('form-plot-not-official');
            await browser.close();
            if(bad.length)throw new Error(bad.join(' | '));
            console.log('ISBN_9788868363710_ALL_FIELDS_GENERIC_OK');
          })().catch(e=>{console.error('ISBN_9788868363710_ALL_FIELDS_GENERIC_FAIL',e.stack||e.message);process.exit(1)});
          JS
          node test.js 2>&1 | tee /tmp/isbn-fast.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Registra risultato
        if: always()
        run: |
          {
            echo "outcome=${{ steps.live.outcome }}"
            echo "source_commit=${GITHUB_SHA}"
            echo "mode=isbn-9788868363710-all-fields-generic-v1"
            echo "isbn=9788868363710"
            echo '---'
            cat /tmp/isbn-fast.log 2>/dev/null || true
          } > live-isbn-fast-result.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || true
          git add live-isbn-fast-result.txt
          git commit -m 'Registra test ISBN rapido' || exit 0
          git push
      - name: Fallisci se test KO
        if: steps.live.outcome != 'success'
        run: exit 1
