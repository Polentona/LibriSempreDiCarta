name: Test ISBN live rapido

on:
  push:
    branches: [main]
    paths:
      - '_fast-test-trigger.txt'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test live trama ufficiale Sperling V6
        id: live
        continue-on-error: true
        run: |
          node --check publisher-plot-resilience-v6.js
          mkdir -p /tmp/isbn-fast && cd /tmp/isbn-fast
          npm init -y >/dev/null 2>&1
          npm install playwright-core@1.55.0 >/dev/null 2>&1
          cat > test.js <<'JS'
          const {chromium}=require('playwright-core');
          const ISBN='9788868363710';
          const TITLE='I lupi del Calla. La torre nera (Vol. 5)';
          const AUTHOR='Stephen King';
          const PUBLISHER='Sperling & Kupfer';
          const SAGA='La Torre Nera';
          const norm=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
          const same=(a,b)=>norm(a)===norm(b);
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1400,height:1100}});
            page.on('pageerror',e=>console.log('PAGE_ERROR',e.message));
            page.on('response',r=>{if(r.status()>=400)console.log('HTTP',r.status(),r.url())});
            await page.goto('https://polentona.github.io/LibriSempreDiCarta/?test-sperling-v6='+Date.now(),{waitUntil:'domcontentloaded',timeout:90000});
            await page.locator('#addBookBtn').click();
            await page.locator('#editDialog[open]').waitFor({timeout:15000});
            await page.locator('#editCode').fill(ISBN);
            await page.locator('#editTitle').fill(TITLE);
            await page.locator('#editAuthor').fill(AUTHOR);
            await page.locator('#editPublisher').fill(PUBLISHER);
            await page.locator('#editSaga').fill(SAGA);

            let formPlot='';
            const until=Date.now()+35000;
            while(Date.now()<until){
              await page.waitForTimeout(1000);
              formPlot=await page.locator('#editPlot').inputValue();
              if(formPlot.length>=500)break;
            }
            const state=await page.evaluate(async({ISBN,TITLE,AUTHOR,PUBLISHER,SAGA})=>{
              let official='';
              try{official=await window.__LIB_RESOLVE_OFFICIAL_PLOT({code:ISBN,title:TITLE,author:AUTHOR,publisher:PUBLISHER,saga:SAGA})||''}catch(e){official='__ERROR__'+String(e)}
              const hooks=window.__LIB_PUBLISHER_PLOT_RESILIENCE_V6_TEST__;
              return {
                official,
                loaderV34:!!window.__LIB_SERIES_NEIGHBORS_STANDALONE_V34,
                plotV6:!!window.__LIB_PUBLISHER_PLOT_RESILIENCE_V6,
                policy:window.__LIB_PLOT_SOURCE_POLICY||'',
                slugs:hooks?.sperlingSlugs?.(TITLE,SAGA,AUTHOR)||[],
                titleMatch:hooks?.sperlingTitleMatch?.('Title: La Torre Nera - I lupi del Calla - Sperling & Kupfer Editore',TITLE,SAGA)||false
              }
            },{ISBN,TITLE,AUTHOR,PUBLISHER,SAGA});
            formPlot=await page.locator('#editPlot').inputValue();
            const status=await page.locator('#lookupStatus').innerText();
            console.log('FINAL',JSON.stringify({
              loaderV34:state.loaderV34,plotV6:state.plotV6,policy:state.policy,slugs:state.slugs,titleMatch:state.titleMatch,
              officialLength:state.official.length,officialPreview:state.official.slice(0,260),
              formPlotLength:formPlot.length,formPlotPreview:formPlot.slice(0,260),status
            }));
            const bad=[];
            if(!state.loaderV34)bad.push('loader-v34');
            if(!state.plotV6)bad.push('plot-v6');
            if(state.policy!=='publisher-first-sperling-direct-v6-then-clean-fallbacks-resilient')bad.push('plot-policy');
            if(!state.slugs.includes('la-torre-nera-i-lupi-del-calla-stephen-king'))bad.push('sperling-slug');
            if(!state.titleMatch)bad.push('title-match');
            if(String(state.official||'').startsWith('__ERROR__'))bad.push('official-error');
            if((state.official||'').length<500)bad.push('official-plot');
            if(formPlot.length<500)bad.push('form-plot');
            if(state.official&&!same(formPlot,state.official))bad.push('official-plot-not-prioritized');
            if(!/^rumore di passi sul sentiero del vettore/i.test(formPlot.trim()))bad.push('wrong-sperling-section');
            if(/uno degli autori piu influenti e amati/i.test(norm(formPlot)))bad.push('author-bio-in-plot');
            await browser.close();
            if(bad.length)throw new Error(bad.join(', '));
            console.log('SPERLING_V6_LIVE_OK');
          })().catch(e=>{console.error('SPERLING_V6_LIVE_FAIL',e.stack||e.message);process.exit(1)});
          JS
          node test.js 2>&1 | tee /tmp/isbn-fast.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Registra risultato
        if: always()
        run: |
          {
            echo "outcome=${{ steps.live.outcome }}"
            echo "source_commit=${GITHUB_SHA}"
            echo "mode=sperling-live-v6"
            echo "isbn=9788868363710"
            echo '---'
            cat /tmp/isbn-fast.log 2>/dev/null || true
          } > live-isbn-fast-result.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || true
          git add live-isbn-fast-result.txt
          git commit -m 'Registra test ISBN rapido' || exit 0
          git push
      - name: Fallisci se test KO
        if: steps.live.outcome != 'success'
        run: exit 1
