name: Test ISBN live rapido

on:
  push:
    branches: [main]
    paths:
      - '_fast-test-trigger.txt'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test live resolver trama Sperling
        id: live
        continue-on-error: true
        run: |
          node --check publisher-plot-resilience-v5.js
          mkdir -p /tmp/isbn-fast && cd /tmp/isbn-fast
          npm init -y >/dev/null 2>&1
          npm install playwright-core@1.55.0 >/dev/null 2>&1
          cat > test.js <<'JS'
          const {chromium}=require('playwright-core');
          const ISBN='9788868363710';
          const TITLE='I lupi del Calla. La torre nera (Vol. 5)';
          const AUTHOR='Stephen King';
          const PUBLISHER='Sperling & Kupfer';
          const SAGA='La Torre Nera';
          const norm=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
          const same=(a,b)=>norm(a)===norm(b);
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1400,height:1100}});
            page.on('pageerror',e=>console.log('PAGE_ERROR',e.message));
            page.on('response',r=>{if(r.status()>=400)console.log('HTTP',r.status(),r.url())});
            await page.goto('https://polentona.github.io/LibriSempreDiCarta/?fast-sperling-resolver='+Date.now(),{waitUntil:'domcontentloaded',timeout:90000});
            await page.locator('#addBookBtn').click();
            await page.locator('#editDialog[open]').waitFor({timeout:15000});
            await page.locator('#editCode').fill(ISBN);
            await page.locator('#editTitle').fill(TITLE);
            await page.locator('#editAuthor').fill(AUTHOR);
            await page.locator('#editPublisher').fill(PUBLISHER);
            await page.locator('#editSaga').fill(SAGA);
            const debug=await page.evaluate(async({ISBN,TITLE,AUTHOR,PUBLISHER,SAGA})=>{
              const hooks=window.__LIB_PUBLISHER_PLOT_RESILIENCE_V5_TEST__;
              const slugs=hooks?.sperlingSlugs?.(TITLE,SAGA,AUTHOR)||[];
              const target='https://www.sperling.it/libri/'+(slugs[0]||'');
              const probe=[];
              for(const u of [target,'https://r.jina.ai/'+target,'https://r.jina.ai/'+target.replace(/^https:\/\//,'http://')]){
                try{
                  const r=await fetch(u,{cache:'no-store'});const t=await r.text();
                  const lines=u.includes('r.jina.ai/')?t.split(/\r?\n/).map((x,i)=>({i,len:x.trim().length,s:x.trim().slice(0,180)})).filter(x=>x.len>=30).slice(0,80):[];
                  probe.push({url:u,status:r.status,length:t.length,hasTitle:t.toLowerCase().includes('lupi del calla'),hasAuthor:t.toLowerCase().includes('stephen king'),lines});
                }catch(e){probe.push({url:u,error:String(e)})}
              }
              let official='';
              try{official=await window.__LIB_RESOLVE_OFFICIAL_PLOT({code:ISBN,title:TITLE,author:AUTHOR,publisher:PUBLISHER,saga:SAGA})||''}catch(e){official='__ERROR__'+String(e)}
              return {slugs,target,probe,official,policy:window.__LIB_PLOT_SOURCE_POLICY||'',loaderV33:!!window.__LIB_SERIES_NEIGHBORS_STANDALONE_V33,plotV5:!!window.__LIB_PUBLISHER_PLOT_RESILIENCE_V5};
            },{ISBN,TITLE,AUTHOR,PUBLISHER,SAGA});
            console.log('DEBUG',JSON.stringify({...debug,officialPreview:String(debug.official||'').slice(0,500)}));
            await page.waitForTimeout(8000);
            const formPlot=await page.locator('#editPlot').inputValue();
            const status=await page.locator('#lookupStatus').innerText();
            console.log('FORM',JSON.stringify({plotLength:formPlot.length,plotPreview:formPlot.slice(0,500),status}));
            const bad=[];
            if(!debug.loaderV33)bad.push('loader-v33');
            if(!debug.plotV5)bad.push('plot-v5');
            if(debug.policy!=='publisher-first-sperling-direct-then-clean-fallbacks-resilient')bad.push('plot-policy');
            if(!debug.slugs.includes('la-torre-nera-i-lupi-del-calla-stephen-king'))bad.push('sperling-slug');
            if(String(debug.official||'').startsWith('__ERROR__'))bad.push('official-error');
            if((debug.official||'').length<120)bad.push('official-plot');
            if(formPlot.length<120)bad.push('form-plot');
            if(debug.official&&!same(formPlot,debug.official))bad.push('official-plot-not-prioritized');
            await browser.close();
            if(bad.length)throw new Error(bad.join(', '));
            console.log('SPERLING_PLOT_OK');
          })().catch(e=>{console.error('SPERLING_PLOT_FAIL',e.stack||e.message);process.exit(1)});
          JS
          node test.js 2>&1 | tee /tmp/isbn-fast.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Registra risultato
        if: always()
        run: |
          {
            echo "outcome=${{ steps.live.outcome }}"
            echo "source_commit=${GITHUB_SHA}"
            echo "mode=sperling-resolver-structure-v5"
            echo "isbn=9788868363710"
            echo '---'
            cat /tmp/isbn-fast.log 2>/dev/null || true
          } > live-isbn-fast-result.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || true
          git add live-isbn-fast-result.txt
          git commit -m 'Registra test ISBN rapido' || exit 0
          git push
      - name: Fallisci se test KO
        if: steps.live.outcome != 'success'
        run: exit 1
