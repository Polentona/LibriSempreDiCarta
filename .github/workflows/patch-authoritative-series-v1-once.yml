name: Collega catalogo serie verificato v1
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collega catalogo verificato
        shell: python
        run: |
          from pathlib import Path

          p=Path('isbn-cover.js')
          s=p.read_text(encoding='utf-8')
          marker='    /* __LIB_PRE_RELATION_NEIGHBORS_V5__ */\n'
          if '__LIB_AUTHORITATIVE_PRELOOKUP_V1__' not in s:
              block=marker
              block+="    /* __LIB_AUTHORITATIVE_PRELOOKUP_V1__ */\n"
              block+="    if(type==='isbn'&&typeof window.__LIB_RESOLVE_AUTHORITATIVE_SERIES_NEIGHBORS==='function'&&candidate.title&&candidate.author&&candidate.saga&&(!candidate.prequel||!candidate.sequel)){\n"
              block+="      try{\n"
              block+="        const localRel=window.__LIB_RESOLVE_AUTHORITATIVE_SERIES_NEIGHBORS({code,title:candidate.title,author:candidate.author,saga:candidate.saga});\n"
              block+="        window.__LIB_LAST_AUTHORITATIVE_SERIES_RESULT__=localRel||null;\n"
              block+="        if(localRel?.prequel){candidate.prequel=String(localRel.prequel).trim();setAutoField('editPrequel',candidate.prequel,true)}\n"
              block+="        if(localRel?.sequel){candidate.sequel=String(localRel.sequel).trim();setAutoField('editSequel',candidate.sequel,true)}\n"
              block+="      }catch(e){window.__LIB_LAST_AUTHORITATIVE_SERIES_ERROR__=String(e&&e.message||e);console.warn('Catalogo serie verificato non disponibile',e)}\n"
              block+="    }\n"
              if marker not in s:
                  raise SystemExit('Marker prelookup non trovato')
              s=s.replace(marker,block,1)
          p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'series-authoritative-catalog-v1.js?v=1' not in s:
              anchor='<script src="series-neighbors-standalone-v5.js?v=5"></script>'
              if anchor not in s:
                  raise SystemExit('Anchor resolver standalone non trovato')
              s=s.replace(anchor,'<script src="series-authoritative-catalog-v1.js?v=1"></script>\n'+anchor,1)
          s=s.replace('bg${i}.js?v=20','bg${i}.js?v=21')
          p.write_text(s,encoding='utf-8')

          p=Path('bg/bg8.js')
          s=p.read_text(encoding='utf-8')
          if 'isbn-cover.js?v=21' not in s and 'isbn-cover.js?v=22' not in s:
              raise SystemExit('Versione isbn-cover attesa non trovata')
          s=s.replace('isbn-cover.js?v=21','isbn-cover.js?v=22')
          p.write_text(s,encoding='utf-8')
      - name: Verifica
        run: |
          node --check series-authoritative-catalog-v1.js
          node --check isbn-cover.js
          grep -F '__LIB_AUTHORITATIVE_PRELOOKUP_V1__' isbn-cover.js
          grep -F 'series-authoritative-catalog-v1.js?v=1' index.html
          grep -F 'bg${i}.js?v=21' index.html
          grep -F 'isbn-cover.js?v=22' bg/bg8.js
      - name: Commit
        run: |
          rm -f .github/workflows/patch-authoritative-series-v1-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add isbn-cover.js bg/bg8.js index.html .github/workflows/patch-authoritative-series-v1-once.yml
          git commit -m 'Usa catalogo verificato prima delle API per prequel e sequel'
          git push
