name: Aggiorna relazioni libri salvati

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-series-relations-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aggiorna versione relazioni
        run: python tools/refresh_relations_version.py
      - name: Verifica
        run: |
          node --check isbn-cover.js
          node --check bg/bg8.js
      - name: Pubblica e pulisci
        run: |
          rm -f tools/refresh_relations_version.py .github/workflows/refresh-series-relations-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add isbn-cover.js bg/bg8.js index.html tools/refresh_relations_version.py .github/workflows/refresh-series-relations-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "Ricalcola relazioni dei libri già salvati"
          git push origin main
