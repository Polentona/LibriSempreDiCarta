name: Integra fonti strutturate saghe v8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-structured-relations-v8-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Applica integrazione
        run: python tools/enable_structured_relations_v8.py

      - name: Verifica JavaScript e caricamento
        run: |
          node --check series-structured-sources.js
          node --check isbn-cover.js
          node --check bg/bg8.js
          grep -q "series-structured-sources.js?v=1" bg/bg8.js
          grep -q "isbn-cover.js?v=19" bg/bg8.js
          grep -q "RELATIONS_LOOKUP_VERSION=8" isbn-cover.js
          grep -q "description:candidate.description" isbn-cover.js

      - name: Pubblica e rimuove i file temporanei
        run: |
          rm -f .github/workflows/enable-structured-relations-v8-once.yml
          rm -f tools/enable_structured_relations_v8.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bg/bg8.js isbn-cover.js series-structured-sources.js .github/workflows/enable-structured-relations-v8-once.yml tools/enable_structured_relations_v8.py
          git commit -m "Usa Wikipedia e campi strutturati per saghe prequel e sequel"
          git push origin main
