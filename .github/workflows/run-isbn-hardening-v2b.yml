name: Applica robustezza ISBN v2b

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-isbn-hardening-v2b.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Applica patch
        run: python tools/patch_isbn_hardening_v2.py
      - name: Verifica JavaScript
        run: |
          node --check italian-catalog-fallback-v3.js
          node --check isbn-resilient-fallback-v1.js
          node --check series-authoritative-catalog-v1.js
      - name: Pubblica modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add italian-catalog-fallback-v3.js isbn-resilient-fallback-v1.js series-authoritative-catalog-v1.js bg/bg8.js index.html
          git commit -m "Rende robusto il recupero ISBN e blocca pagine generiche"
          git push origin main

# trigger v2b
