name: QA diagnostica ISBN 9788845283253
on:
  push:
    branches: [qa-isbn-9788845283253]
    paths: ['.github/workflows/e2e-temp-isbn-9788845283253.yml']
permissions:
  contents: read
jobs:
  test-isbn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installa Playwright
        shell: bash
        run: |
          mkdir -p /tmp/e2e-isbn
          cd /tmp/e2e-isbn
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Diagnostica sorgenti sul sito pubblico
        shell: bash
        working-directory: /tmp/e2e-isbn
        run: |
          cat > test.js <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const failed=[];
            page.on('response',r=>{ if(r.status()>=400) failed.push({status:r.status(),url:r.url()}); });
            page.on('requestfailed',r=>failed.push({status:'FAILED',url:r.url(),error:r.failure()?.errorText||''}));
            await page.goto('https://polentona.github.io/LibriSempreDiCarta/?qa-diag='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.locator('#addBookBtn').click();
            await page.locator('#editCode').fill('9788845283253');
            await page.locator('#lookupMetadataBtn').click();
            await page.waitForTimeout(15000);
            const result=await page.evaluate(()=>{
              const val=id=>document.querySelector(id)?.value||'';
              return {title:val('#editTitle'),author:val('#editAuthor'),category:val('#editCategory'),publisher:val('#editPublisher'),publication:val('#editPublication'),saga:val('#editSaga'),prequel:val('#editPrequel'),sequel:val('#editSequel'),cover:val('#editCover'),plot:val('#editPlot')};
            });
            console.log('ISBN_DIAG_RESULT='+JSON.stringify(result));
            console.log('ISBN_DIAG_FAILED='+JSON.stringify(failed));
            await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node test.js
