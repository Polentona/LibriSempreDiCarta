name: QA diagnostica ISBN 9788845283253
on:
  push:
    branches: [qa-isbn-9788845283253]
    paths: ['.github/workflows/e2e-temp-isbn-9788845283253.yml']
permissions:
  contents: read
jobs:
  test-isbn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installa Playwright
        shell: bash
        run: |
          mkdir -p /tmp/e2e-isbn
          cd /tmp/e2e-isbn
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Diagnostica scoperta fonti
        shell: bash
        working-directory: /tmp/e2e-isbn
        run: |
          cat > test.js <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            await page.goto('https://polentona.github.io/LibriSempreDiCarta/?qa-source='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            const data=await page.evaluate(async()=>{
              const q='"9788845283253" (site:thebanco.it OR site:ibs.it OR site:libraccio.it OR site:bompiani.it)';
              const urls=[
                'https://r.jina.ai/https://www.bing.com/search?setlang=it-IT&q='+encodeURIComponent(q),
                'https://r.jina.ai/https://thebanco.it/search?keyword=9788845283253',
                'https://r.jina.ai/https://thebanco.it/search?q=9788845283253'
              ];
              const out=[];
              for(const url of urls){
                try{const r=await fetch(url);const t=await r.text();out.push({url,status:r.status,text:t.slice(0,12000)})}
                catch(e){out.push({url,error:String(e)})}
              }
              return out;
            });
            for(const x of data){
              console.log('SRC_URL='+x.url);
              console.log('SRC_STATUS='+(x.status||x.error));
              console.log('SRC_TEXT='+String(x.text||'').replace(/\n/g,'\\n'));
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node test.js
