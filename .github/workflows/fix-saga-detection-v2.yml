name: Migliora riconoscimento saga v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-saga-detection-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch saga
        run: |
          echo '' | base64 -d > /tmp/patch.py
          sed -i 's/s=re.sub(pattern,new_block,s,count=1,flags=re.S)/s=re.sub(pattern,lambda m:new_block,s,count=1,flags=re.S)/' /tmp/patch.py
          python /tmp/patch.py
      - name: Verifica
        run: |
          node --check italian-catalog-fallback-v3.js
          node --check bg/bg8.js
      - name: Pubblica
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add italian-catalog-fallback-v3.js bg/bg8.js
          git diff --cached --quiet && exit 0
          git commit -m "Cerca le saghe anche nei cataloghi autore"
          git push origin main
