name: Generalizza regole metadati per tutti i libri

on:
  push:
    branches: [main]
    paths:
      - 'tools/generalize_book_metadata_rules.py'
      - '.github/workflows/generalize-book-metadata-rules.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Applica regole generali
        run: python tools/generalize_book_metadata_rules.py
      - name: Verifica JavaScript
        run: |
          node --check italian-catalog-fallback-v3.js
          node --check isbn-cover.js
          node --check bg/bg8.js
      - name: Pubblica modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add italian-catalog-fallback-v3.js isbn-cover.js bg/bg8.js
          git diff --cached --quiet && exit 0
          git commit -m "Generalizza autore titolo saga per tutti gli ISBN"
          git push origin main
