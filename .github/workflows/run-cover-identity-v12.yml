name: Verifica identita copertine v12
on:
  push:
    branches: [main]
    paths:
      - 'tools/fix_cover_identity_v12.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Applica patch
        run: python tools/fix_cover_identity_v12.py
      - name: Verifica sintassi
        run: node --check isbn-cover.js
      - name: Verifica regole strutturali
        run: |
          grep -q "retailListingUrl" isbn-cover.js
          grep -q "retailPageMatchesBook" isbn-cover.js
          grep -q "thebanco.it" isbn-cover.js
          grep -q "isbn-cover.js?v=20260817-12" index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add isbn-cover.js index.html
          git commit -m "Verifica che le copertine appartengano davvero all ISBN"
          git push
