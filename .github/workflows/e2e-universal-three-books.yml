name: E2E universale tre ISBN
on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]
permissions:
  contents: read
jobs:
  test-three:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installa Playwright
        run: |
          mkdir -p /tmp/e2e-three
          cd /tmp/e2e-three
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Verifica i tre ISBN sul sito pubblico
        working-directory: /tmp/e2e-three
        run: |
          cat > test.js <<'JS'
          const { chromium } = require('playwright');
          const fs=require('fs');
          const cases=[
            {isbn:'9788845283253',title:'I sussurri della morte',author:'Simon Beckett',saga:'David Hunter',prequel:'Scritto nelle ossa',sequel:'La voce dei morti'},
            {isbn:'9788845201127',title:'La voce dei morti',author:'Simon Beckett',saga:'David Hunter',prequel:'I sussurri della morte',sequel:'Acque morte'},
            {isbn:'9788817045261',title:'Torment',author:'Lauren Kate',saga:'Fallen',prequel:'Fallen',sequel:'Passion'}
          ];
          const norm=s=>String(s||'').replace(/[’‘]/g,"'").replace(/\s+/g,' ').trim().toLowerCase();
          (async()=>{
            const browser=await chromium.launch({headless:true});const all=[];let failed=false;
            for(const c of cases){
              const page=await browser.newPage();const consoleLines=[];let result={};
              page.on('console',m=>consoleLines.push(`[${m.type()}] ${m.text()}`));
              page.on('pageerror',e=>consoleLines.push(`[pageerror] ${e.message}`));
              try{
                await page.goto('https://polentona.github.io/LibriSempreDiCarta/?e2e-universal='+c.isbn+'-'+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
                await page.locator('#addBookBtn').waitFor({state:'visible',timeout:30000});
                await page.locator('#addBookBtn').click();
                await page.locator('#editCode').waitFor({state:'visible',timeout:30000});
                await page.locator('#editCode').fill(c.isbn);
                await page.locator('#lookupMetadataBtn').click();
                await page.waitForFunction(()=>{
                  const t=document.querySelector('#editTitle')?.value||'';
                  const o=document.querySelector('#metadataOverlay');
                  const st=document.querySelector('#lookupStatus')?.textContent||'';
                  return !!t||(o&&o.open)||/non ho trovato dati affidabili/i.test(st);
                },null,{timeout:150000});
                if(await page.locator('#metadataOverlay').evaluate(el=>!!el.open).catch(()=>false)){
                  const choices=page.locator('[data-meta-choice]');const n=await choices.count();let chosen=false;
                  for(let i=0;i<n;i++){const txt=await choices.nth(i).innerText();if(norm(txt).includes(norm(c.title))&&norm(txt).includes(norm(c.author))){await choices.nth(i).click();chosen=true;break}}
                  if(!chosen&&n===1)await choices.first().click();
                }
                await page.waitForFunction(()=>{
                  const st=document.querySelector('#lookupStatus');return !(st?.classList.contains('lookup-busy')||st?.querySelector('.lookup-book-spinner'));
                },null,{timeout:150000}).catch(()=>{});
                await page.waitForFunction(()=>{
                  const s=document.querySelector('#editSaga')?.value||'',p=document.querySelector('#editPrequel')?.value||'',q=document.querySelector('#editSequel')?.value||'';return !!s&&!!p&&!!q;
                },null,{timeout:30000}).catch(()=>{});
                result=await page.evaluate(()=>({
                  title:document.querySelector('#editTitle')?.value||'',author:document.querySelector('#editAuthor')?.value||'',publisher:document.querySelector('#editPublisher')?.value||'',publishedDate:document.querySelector('#editPublishedDate')?.value||'',saga:document.querySelector('#editSaga')?.value||'',prequel:document.querySelector('#editPrequel')?.value||'',sequel:document.querySelector('#editSequel')?.value||'',status:document.querySelector('#lookupStatus')?.textContent||'',universal:window.__LIB_LAST_UNIVERSAL_SERIES_RESULT__||null,universalDiag:window.__LIB_UNIVERSAL_SERIES_LAST__||null,resilient:window.__LIB_RESILIENT_ISBN_LAST__||null,resilientError:window.__LIB_RESILIENT_ISBN_DIRECT_ERROR__||null
                }));
                const errs=[];
                for(const k of ['title','author','saga','prequel','sequel'])if(norm(result[k])!==norm(c[k]))errs.push(`${k}=${JSON.stringify(result[k])}`);
                if(/non ho trovato dati affidabili/i.test(result.status))errs.push('lookup senza dati affidabili');
                all.push({case:c,result,consoleLines:consoleLines.slice(-80),errors:errs});
                console.log('E2E_UNIVERSAL_RESULT='+c.isbn+' '+JSON.stringify(result));
                if(errs.length){failed=true;console.error('E2E_UNIVERSAL_MISMATCH='+c.isbn+' '+errs.join(' | '))}
              }catch(e){failed=true;all.push({case:c,result,consoleLines:consoleLines.slice(-80),error:String(e&&e.stack||e)});console.error('E2E_UNIVERSAL_ERROR='+c.isbn,e)}
              await page.close();
            }
            fs.writeFileSync('universal-three.json',JSON.stringify(all,null,2));
            await browser.close();if(failed)process.exitCode=1;
          })();
          JS
          node test.js
      - name: Carica diagnostica
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-three-isbn-e2e
          path: /tmp/e2e-three/universal-three.json
          if-no-files-found: ignore
          retention-days: 3
