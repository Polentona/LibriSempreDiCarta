name: Esegue patch robusta titoli ISBN
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-resilient-isbn-v2b.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Applica patch
        run: python tools/patch_resilient_isbn_v2.py
      - name: Verifica sintassi
        run: node --check isbn-resilient-fallback-v1.js
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add isbn-resilient-fallback-v1.js index.html
          git commit -m 'Rifiuta contatori e UI come titoli ISBN'
          git push
