name: Attiva lookup diretto pagine saga v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-series-pages-v2-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Collega il lookup diretto delle pagine di serie
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text()
          old = '<script src="series-google-books-order-v10.js?v=1"></script>\n<script src="lookup-lock.js?v=1"></script>'
          new = '<script src="series-google-books-order-v10.js?v=1"></script>\n<script src="series-series-pages-v2.js?v=1"></script>\n<script src="lookup-lock.js?v=1"></script>'
          if old not in html:
              raise SystemExit('Punto di inserimento del nuovo motore non trovato in index.html')
          index.write_text(html.replace(old, new, 1))
          PY

      - name: Verifica JavaScript e collegamento
        run: |
          node --check series-series-pages-v2.js
          grep -q 'series-series-pages-v2.js?v=1' index.html

      - name: Pubblica e rimuove il workflow temporaneo
        run: |
          rm -f .github/workflows/enable-series-pages-v2-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/enable-series-pages-v2-once.yml
          git commit -m "Attiva lookup diretto pagine serie per prequel e sequel"
          git push origin main
