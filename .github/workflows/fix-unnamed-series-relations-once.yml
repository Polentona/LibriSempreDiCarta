name: Corregge relazioni serie senza nome

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-unnamed-series-relations-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Applica patch
        run: python _fix_unnamed_relations.py

      - name: Verifica JavaScript
        run: |
          node --check series-relations.js
          node --check isbn-cover.js
          node --check bg/bg8.js
          grep -q 'parseChronologicalOrder' series-relations.js
          grep -q 'series-relations.js?v=5' bg/bg8.js
          grep -q 'RELATIONS_LOOKUP_VERSION=5' isbn-cover.js

      - name: Pubblica e pulisci
        run: |
          rm -f .github/workflows/fix-unnamed-series-relations-once.yml _fix_unnamed_relations.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add series-relations.js isbn-cover.js bg/bg8.js .github/workflows/fix-unnamed-series-relations-once.yml _fix_unnamed_relations.py
          git diff --cached --quiet && exit 0
          git commit -m "Rileva prequel e sequel anche nelle serie senza nome"
          git push origin main
