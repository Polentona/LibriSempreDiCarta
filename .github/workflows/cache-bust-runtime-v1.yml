name: Aggiorna versioni runtime

on:
  push:
    branches: [main]
    paths:
      - 'series-relations-direct-v7.js'
      - 'series-wikipedia-authoritative-v3.js'
      - 'series-neighbors-standalone-v5.js'
      - 'series-authoritative-runtime-v4.js'
      - 'series-single-owner-guard-v1.js'
      - 'series-google-books-order-v10.js'
      - 'series-authoritative-catalog-v1.js'
      - 'genres-authoritative-v3.js'
      - 'storygraph-goodreads-genres-v3.js'
      - 'genres-multi-v1.js'
      - 'publisher-plot-lock-v8.js'
      - 'isbn-resilient-fallback-v1.js'
      - 'isbn-cover.js'
      - '.github/workflows/cache-bust-runtime-v1.yml'

permissions:
  contents: write

concurrency:
  group: cache-bust-runtime
  cancel-in-progress: true

jobs:
  cache-bust:
    if: ${{ !startsWith(github.event.head_commit.message, 'Aggiorna cache runtime') }}
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Forza caricamento script aggiornati
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          versions={
            'series-relations-direct-v7.js':'20260820-guard-1',
            'series-wikipedia-authoritative-v3.js':'20260820-disabled-1',
            'series-authoritative-catalog-v1.js':'6',
            'series-google-books-order-v10.js':'20260820-single-owner-2',
            'series-neighbors-standalone-v5.js':'20260820-40',
            'series-universal-resolver-v1.js':'20260819-7',
            'isbn-resilient-fallback-v1.js':'20260819-11',
            'isbn-cover.js':'20260820-relations-cache-1'
          }
          for filename,version in versions.items():
              s=re.sub(re.escape(filename)+r'\?v=[^"\']+', filename+'?v='+version, s)
          p.write_text(s,encoding='utf-8')
          PY
          if git diff --quiet -- index.html; then
            echo 'Versioni già aggiornate.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Aggiorna cache runtime ISBN' || exit 0
          git push