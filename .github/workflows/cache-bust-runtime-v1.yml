name: Verifica cache runtime

on:
  push:
    branches: [main]
    paths:
      - 'series-relations-direct-v7.js'
      - 'series-wikipedia-authoritative-v3.js'
      - 'series-neighbors-standalone-v5.js'
      - 'series-authoritative-runtime-v7.js'
      - 'series-single-owner-guard-v1.js'
      - 'series-google-books-order-v10.js'
      - 'series-authoritative-catalog-v1.js'
      - 'genres-authoritative-v3.js'
      - 'storygraph-goodreads-genres-v3.js'
      - 'genres-multi-v1.js'
      - 'publisher-plot-lock-v8.js'
      - 'isbn-field-sanitizer-v2.js'
      - 'isbn-resilient-fallback-v1.js'
      - 'isbn-cover.js'
      - '.github/workflows/pages.yml'
      - '.github/workflows/cache-bust-runtime-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-runtime-policy
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
      - name: Verifica cache-busting gestito dal deploy
        run: |
          grep -q "Forza cache runtime nell'artefatto" .github/workflows/pages.yml
          grep -q "GITHUB_SHA" .github/workflows/pages.yml
          grep -q "series-neighbors-standalone-v5.js" .github/workflows/pages.yml
          grep -q "isbn-cover.js" .github/workflows/pages.yml
          grep -q "series-authoritative-runtime-v7.js" series-neighbors-standalone-v5.js
          grep -q "isbn-field-sanitizer-v2.js" series-neighbors-standalone-v5.js
          ! grep -q "series-authoritative-runtime-v6.js" series-neighbors-standalone-v5.js
          ! grep -q "isbn-field-sanitizer-v1.js" series-neighbors-standalone-v5.js
          if grep -Eq '^[[:space:]]*git[[:space:]]+push\b' .github/workflows/cache-bust-runtime-v1.yml; then
            echo "Il workflow cache non deve più creare commit automatici su main."
            exit 1
          fi
          echo "Cache runtime gestita nel singolo deploy Pages: OK"
