name: Aggiorna versioni runtime

on:
  push:
    branches: [main]
    paths:
      - 'series-neighbors-standalone-v5.js'
      - 'series-universal-resolver-v1.js'
      - 'isbn-resilient-fallback-v1.js'

permissions:
  contents: write

concurrency:
  group: cache-bust-runtime
  cancel-in-progress: true

jobs:
  cache-bust:
    if: ${{ !startsWith(github.event.head_commit.message, 'Aggiorna cache runtime') }}
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Forza caricamento script aggiornati
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          versions={
            'series-neighbors-standalone-v5.js':'20260820-34',
            'series-universal-resolver-v1.js':'20260819-7',
            'isbn-resilient-fallback-v1.js':'20260819-11'
          }
          for filename,version in versions.items():
              s=re.sub(re.escape(filename)+r'\?v=[^"\']+', filename+'?v='+version, s)
          p.write_text(s,encoding='utf-8')
          PY
          if git diff --quiet -- index.html; then
            echo 'Versioni già aggiornate.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Aggiorna cache runtime ISBN"
          git push
