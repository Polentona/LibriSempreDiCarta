name: Copertine Messaggerie EAN v13
on:
  push:
    branches: [main]
    paths:
      - 'tools/add_messaggerie_cover_v13.py'
      - '.github/workflows/run-messaggerie-cover-v13.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Applica patch
        run: python tools/add_messaggerie_cover_v13.py
      - name: Verifica sintassi
        run: node --check isbn-cover.js
      - name: Verifica fonte EAN
        run: |
          grep -q "img.messaggerielibri.it/images" isbn-cover.js
          grep -q "Messaggerie Libri · EAN" isbn-cover.js
          grep -q "isbn-cover.js?v=20260817-13" index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add isbn-cover.js index.html
          git commit -m "Usa copertine Messaggerie collegate direttamente all EAN"
          git push
# trigger v13
