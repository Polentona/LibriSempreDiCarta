name: E2E filtro trama globale e recupero editore v8
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/e2e-plot-cover-quality-v7.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installa Playwright
        run: |
          mkdir -p /tmp/e2e-plot-v8
          cd /tmp/e2e-plot-v8
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Test filtro e trama ufficiale sul sito pubblico
        working-directory: /tmp/e2e-plot-v8
        run: |
          cat > test.js <<'JS'
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});let failed=false;
            const page=await browser.newPage();
            try{
              await page.goto('https://polentona.github.io/LibriSempreDiCarta/?e2e-plot-v8='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
              await page.locator('#addBookBtn').waitFor({state:'visible',timeout:30000});await page.locator('#addBookBtn').click();
              await page.waitForFunction(()=>typeof window.__LIB_CLEAN_BOOK_PLOT==='function'&&typeof window.__LIB_RESOLVE_OFFICIAL_PLOT==='function',null,{timeout:30000});
              const review=`a mio parere nuova e ben sviluppata. Bello come finale della storia principale Read more Read less) Helpful Sending feedback...Thank you for your feedback. Sorry, we failed to record your vote. Verified Purchase simone dominicis 4 out of 5 stars Appassionante Reviewed in Italy on 5 February 2023. Rapture di Lauren Kate è un libro per giovani adulti.`;
              const bad=await page.evaluate(review=>window.__LIB_CLEAN_BOOK_PLOT(review),review);
              console.log('GLOBAL_REVIEW_FILTER='+JSON.stringify(bad));if(bad!==''){failed=true;console.error('REVIEW_ACCEPTED='+JSON.stringify(bad))}
              const official=await page.evaluate(()=>window.__LIB_RESOLVE_OFFICIAL_PLOT({title:'Rapture. Nuova ediz.',author:'Lauren Kate',publisher:'Rizzoli'}));
              console.log('OFFICIAL_RAPTURE_PLOT='+JSON.stringify(official));
              const noise=/a mio parere|reviewed in|verified purchase|helpful|sending feedback|read more|read less|double tap|translate review|out of 5 stars/i;
              if(!official||official.length<150||noise.test(official)||!/Luce/i.test(official)||!/Daniel/i.test(official)){failed=true;console.error('OFFICIAL_PLOT_INVALID')}
            }catch(e){failed=true;console.error(String(e&&e.stack||e))}
            await browser.close();if(failed)process.exitCode=1;
          })();
          JS
          node test.js
