name: E2E copertine verificate v12
on:
  workflow_run:
    workflows: ['Deploy GitHub Pages']
    types: [completed]
permissions:
  contents: read
jobs:
  test-cover:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installa Playwright
        run: |
          mkdir -p /tmp/e2e-cover-v12
          cd /tmp/e2e-cover-v12
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Verifica ISBN e fonti copertina
        working-directory: /tmp/e2e-cover-v12
        run: |
          cat > test.js <<'JS'
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const logs=[];page.on('console',m=>logs.push(`[${m.type()}] ${m.text()}`));page.on('pageerror',e=>logs.push(`[pageerror] ${e.message}`));
            await page.goto('https://polentona.github.io/LibriSempreDiCarta/?e2e-cover-v12='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.locator('#addBookBtn').click();
            await page.locator('#editCode').fill('9788845283253');
            await page.waitForTimeout(1200);
            if(await page.locator('#lookupMetadataBtn').isEnabled())await page.locator('#lookupMetadataBtn').click().catch(()=>{});
            await page.waitForFunction(()=>{
              const t=document.querySelector('#editTitle')?.value||'',o=document.querySelector('#metadataOverlay');
              return /sussurri/i.test(t)||(o&&o.open);
            },null,{timeout:150000});
            const overlay=page.locator('#metadataOverlay');
            if(await overlay.evaluate(el=>!!el.open).catch(()=>false)){
              const heading=(await page.locator('#metadataPickerTitle').innerText()).trim();
              if(!/copertina/i.test(heading)){
                const choices=page.locator('[data-meta-choice]');const n=await choices.count();let chosen=false;
                for(let i=0;i<n;i++){const txt=await choices.nth(i).innerText();if(/sussurri della morte/i.test(txt)&&/simon beckett/i.test(txt)){await choices.nth(i).click();chosen=true;break}}
                if(!chosen&&n===1)await choices.first().click();
              }
            }
            await page.waitForTimeout(25000);
            const result=await page.evaluate(()=>({
              title:document.querySelector('#editTitle')?.value||'',
              author:document.querySelector('#editAuthor')?.value||'',
              cover:document.querySelector('#editCover')?.value||'',
              pickerTitle:document.querySelector('#metadataPickerTitle')?.textContent||'',
              pickerOpen:!!document.querySelector('#metadataOverlay')?.open,
              coverSources:[...document.querySelectorAll('.cover-choice span')].map(x=>x.textContent.trim()),
              coverUrls:[...document.querySelectorAll('.cover-choice img')].map(x=>x.src),
              retailPages:window.__LIB_LAST_RETAIL_COVER_PAGES__||null,
              quality:window.__LIB_LAST_COVER_QUALITY__||null
            }));
            console.log('COVER_IDENTITY_RESULT='+JSON.stringify(result));
            if(!/sussurri della morte/i.test(result.title)||!/simon beckett/i.test(result.author))throw new Error('Metadati libro non coerenti: '+JSON.stringify(result));
            const bad=(result.retailPages||[]).filter(x=>x.status==='verified-product'&&/(?:\/search(?:\/|\?|$)|[?&](?:q|query|keyword|search|s)=)/i.test(x.url));
            if(bad.length)throw new Error('Una pagina di ricerca e stata accettata come prodotto: '+JSON.stringify(bad));
            if((result.coverSources||[]).some(x=>/giunti|libraccio/i.test(x))){
              const verified=(result.retailPages||[]).filter(x=>x.status==='verified-product');
              if(!verified.length)throw new Error('Copertine retailer mostrate senza una scheda prodotto verificata');
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node test.js
