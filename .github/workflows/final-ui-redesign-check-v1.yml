name: Verifica finale redesign UI v1

on:
  push:
    branches: ["main"]
    paths:
      - "ui-redesign-20260818.txt"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installa Playwright
        run: |
          mkdir -p /tmp/final-ui-check && cd /tmp/final-ui-check
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Attendi Pages e verifica HTML
        id: html
        continue-on-error: true
        run: |
          ok=0
          for i in $(seq 1 30); do
            if curl -fsSL --max-time 20 "https://polentona.github.io/LibriSempreDiCarta/?final-html=$RANDOM" -o /tmp/live.html; then
              if grep -q 'id="editInLibrary"' /tmp/live.html && grep -q "currentView='home'" /tmp/live.html && grep -q 'data-author-letter' /tmp/live.html && grep -q 'class="series-row"' /tmp/live.html; then
                ok=1; break
              fi
            fi
            sleep 10
          done
          echo "HTML_OK=$ok" | tee /tmp/final-result.log
          echo "HTML_BYTES=$(wc -c </tmp/live.html 2>/dev/null || echo 0)" >> /tmp/final-result.log
          test "$ok" = 1
      - name: Test browser pubblico
        id: browser
        if: steps.html.outcome == 'success'
        continue-on-error: true
        working-directory: /tmp/final-ui-check
        run: |
          cat > test.js <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1920,height:1080}});
            const pageErrors=[];page.on('pageerror',e=>pageErrors.push(e.message));
            const books=[
              {id:1,title:'Fallen',author:'Lauren Kate',category:'Fantasy',saga:'Fallen',publishedDate:'2009',rating:4,inLibrary:true,read:true,cover:'',plot:'',notes:'',loanTo:'',loanDate:''},
              {id:2,title:'Torment',author:'Lauren Kate',category:'Fantasy',saga:'Fallen',publishedDate:'2010',rating:5,inLibrary:false,read:true,cover:'',plot:'',notes:'',loanTo:'',loanDate:''},
              {id:3,title:'Passion',author:'Lauren Kate',category:'Fantasy',saga:'Fallen',publishedDate:'2011',rating:3,inLibrary:true,read:false,cover:'',plot:'',notes:'',loanTo:'',loanDate:''},
              {id:4,title:'Rapture',author:'Lauren Kate',category:'Fantasy',saga:'Fallen',publishedDate:'2012',rating:4,inLibrary:false,read:false,cover:'',plot:'',notes:'',loanTo:'',loanDate:''},
              {id:5,title:'Fallen in Love',author:'Lauren Kate',category:'Fantasy',saga:'Fallen',publishedDate:'2012',rating:0,inLibrary:true,read:false,cover:'',plot:'',notes:'',loanTo:'',loanDate:''},
              {id:6,title:'Angels in the Dark',author:'Lauren Kate',category:'Fantasy',saga:'Fallen',publishedDate:'2013',rating:0,inLibrary:false,read:false,cover:'',plot:'',notes:'',loanTo:'',loanDate:''},
              {id:7,title:'Unforgiven',author:'Lauren Kate',category:'Fantasy',saga:'Fallen',publishedDate:'2015',rating:0,inLibrary:true,read:false,cover:'',plot:'',notes:'',loanTo:'',loanDate:''},
              {id:8,title:'Shining',author:'Stephen King',category:'Horror',saga:'',publishedDate:'1977',rating:5,inLibrary:true,read:true,cover:'',plot:'',notes:'',loanTo:'',loanDate:''},
              {id:9,title:'La voce dei morti',author:'Simon Beckett',category:'Thriller',saga:'David Hunter',publishedDate:'2011',rating:4,inLibrary:false,read:false,cover:'',plot:'',notes:'',loanTo:'',loanDate:''},
              {id:10,title:'Sacrifice',author:'Alexandra Adornetto',category:'Fantasy',saga:'Rebel',publishedDate:'2012',rating:2,inLibrary:true,read:false,cover:'',plot:'',notes:'',loanTo:'',loanDate:''}
            ];
            const r={};
            try{
              await page.goto('https://polentona.github.io/LibriSempreDiCarta/?final-browser='+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});
              await page.evaluate(data=>{localStorage.setItem('libriDiCarta.books.v1',JSON.stringify(data));localStorage.removeItem('libriDiCarta.seriesNotes.v1')},books);
              await page.reload({waitUntil:'domcontentloaded',timeout:120000});
              await page.locator('#addBookBtn').waitFor({state:'visible',timeout:30000});
              r.active=(await page.locator('.links a.active').innerText()).trim();if(r.active!=='Home')throw new Error('vista iniziale '+r.active);
              r.home=await page.locator('.book').count();if(r.home!==10)throw new Error('home '+r.home);
              const nav=await page.locator('.nav').boundingBox(),add=await page.locator('#addBookBtn').boundingBox();r.navContained=!!(nav&&add&&add.x+add.width<=nav.x+nav.width+1);if(!r.navContained)throw new Error('Aggiungi libro fuori banner');
              await page.locator('[data-view="library"]').click();r.library=await page.locator('.book').count();if(r.library!==6)throw new Error('library '+r.library);if(/tutti i libri, uno sotto l.altro/i.test(await page.locator('.intro').innerText()))throw new Error('sottotitolo libreria');
              if(/in libreria/i.test(await page.locator('.book').first().innerText()))throw new Error('In libreria visibile in card normale');
              await page.locator('.book').first().locator('[data-edit]').click();r.checkbox=await page.locator('#editInLibrary').count();if(r.checkbox!==1)throw new Error('checkbox mancante');await page.locator('#cancelEdit').click();
              await page.locator('[data-view="authors"]').click();r.letters=await page.locator('.alphabet-btn').count();r.authors=await page.locator('.author-entry-name').allInnerTexts();if(r.letters!==26)throw new Error('lettere '+r.letters);if(r.authors.join('|')!=='Alexandra Adornetto|Simon Beckett|Lauren Kate|Stephen King')throw new Error('ordine autori '+r.authors.join('|'));await page.locator('[data-author-letter="K"]').click();const k=await page.locator('.author-entry-name').allInnerTexts();if(k.join('|')!=='Lauren Kate')throw new Error('filtro K '+k.join('|'));
              await page.locator('[data-view="categories"]').click();await page.locator('#categoryFilter').selectOption({label:'Fantasy'});r.fantasy=await page.locator('.book').count();if(r.fantasy!==8)throw new Error('fantasy '+r.fantasy);const catAuthors=await page.locator('.book .author').allInnerTexts();const surnames=catAuthors.map(x=>x.trim().split(/\s+/).pop().toLowerCase());for(let i=1;i<surnames.length;i++)if(surnames[i-1].localeCompare(surnames[i],'it')>0)throw new Error('ordine categoria');
              await page.locator('[data-view="series"]').click();r.series=await page.locator('.series-row').count();if(r.series!==3)throw new Error('serie '+r.series);if(await page.locator('.series-row .book').count())throw new Error('libri singoli in saghe');const fallen=page.locator('.series-row').filter({hasText:'FALLEN'}).first();r.covers1=await fallen.locator('.series-cover-card').count();if(r.covers1!==5)throw new Error('copertine 1 '+r.covers1);r.owned=await fallen.locator('.series-owned').allInnerTexts();if(r.owned.filter(x=>/in libreria/i.test(x)).length<2)throw new Error('etichette possesso');await fallen.locator('[data-series-dir="1"]').click();const fallen2=page.locator('.series-row').filter({hasText:'FALLEN'}).first();r.covers2=await fallen2.locator('.series-cover-card').count();if(r.covers2!==2)throw new Error('copertine 2 '+r.covers2);const note=fallen2.locator('[data-series-note]');await note.fill('Saga completa');await note.blur();await page.locator('[data-view="home"]').click();await page.locator('[data-view="series"]').click();r.note=await page.locator('.series-row').filter({hasText:'FALLEN'}).first().locator('[data-series-note]').inputValue();if(r.note!=='Saga completa')throw new Error('nota non salvata');
              if(pageErrors.length)throw new Error('page errors '+pageErrors.join(' | '));
              console.log('BROWSER_OK '+JSON.stringify(r));
            }catch(e){console.error('BROWSER_FAIL '+e.message+' '+JSON.stringify(r));process.exitCode=1}
            await browser.close();
          })();
          JS
          node test.js 2>&1 | tee -a /tmp/final-result.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Registra risultato finale
        if: always()
        run: |
          {
            echo "html=${{ steps.html.outcome }}"
            echo "browser=${{ steps.browser.outcome }}"
            echo "---"
            cat /tmp/final-result.log 2>/dev/null || true
          } > final-ui-redesign-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add final-ui-redesign-result.txt
          git commit -m "Registra verifica finale redesign UI"
          git push
      - name: Fallisci se necessario
        if: steps.html.outcome != 'success' || steps.browser.outcome != 'success'
        run: exit 1
