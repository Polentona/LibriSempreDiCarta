name: Verifica live compilazione ISBN

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]

permissions:
  contents: write

jobs:
  isbn-live:
    if: ${{ github.event.workflow_run.conclusion == 'success' && !startsWith(github.event.workflow_run.head_commit.message, 'Registra esito test ISBN live') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installa Playwright
        run: |
          mkdir -p /tmp/isbn-live && cd /tmp/isbn-live
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Prova ISBN 9788845278389 e trama Bompiani
        id: test
        continue-on-error: true
        working-directory: /tmp/isbn-live
        run: |
          node --check "$GITHUB_WORKSPACE/publisher-plot-priority-v2.js"
          cat > test.js <<'JS'
          const {chromium}=require('playwright');
          const expected={title:'Il valzer lento delle tartarughe',author:'Katherine Pancol',publisher:'Bompiani',year:'2015'};
          const norm=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
          const same=(a,b)=>norm(a)===norm(b);
          const read=page=>page.evaluate(()=>({
            title:document.getElementById('editTitle')?.value||'',author:document.getElementById('editAuthor')?.value||'',publisher:document.getElementById('editPublisher')?.value||'',publishedDate:document.getElementById('editPublishedDate')?.value||'',plot:document.getElementById('editPlot')?.value||'',genres:document.getElementById('editCategory')?.value||'',status:document.getElementById('lookupStatus')?.innerText||'',plotV2:!!window.__LIB_PUBLISHER_PLOT_PRIORITY_V2,plotPolicy:window.__LIB_PLOT_SOURCE_POLICY||''
          }));
          (async()=>{
            const browser=await chromium.launch({headless:true});const page=await browser.newPage({viewport:{width:1500,height:1200}}),errors=[];
            page.on('pageerror',e=>errors.push(e.message));page.on('response',r=>{if(r.status()>=400)console.log('HTTP_ERROR',r.status(),r.url())});
            try{
              await page.goto('https://polentona.github.io/LibriSempreDiCarta/?plot-live='+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});
              await page.locator('#addBookBtn').click();await page.locator('#editDialog[open]').waitFor({state:'visible',timeout:20000});await page.locator('#editCode').fill('9788845278389');await page.locator('#lookupMetadataBtn').click();
              let last={};const deadline=Date.now()+100000;while(Date.now()<deadline){await page.waitForTimeout(1000);last=await read(page);if(same(last.title,expected.title)&&same(last.author,expected.author)&&same(last.publisher,expected.publisher)&&String(last.publishedDate).includes(expected.year)&&last.plotV2&&last.plot.length>=200)break}
              const official=await page.evaluate(async()=>typeof window.__LIB_RESOLVE_OFFICIAL_PLOT==='function'?await window.__LIB_RESOLVE_OFFICIAL_PLOT({code:'9788845278389',title:document.getElementById('editTitle')?.value||'',author:document.getElementById('editAuthor')?.value||'',publisher:document.getElementById('editPublisher')?.value||''}):'');
              console.log('FINAL_PLOT',JSON.stringify({title:last.title,author:last.author,publisher:last.publisher,publishedDate:last.publishedDate,genres:last.genres,plotLength:last.plot.length,officialLength:official.length,status:last.status,plotV2:last.plotV2,plotPolicy:last.plotPolicy}));
              const bad=[];if(!same(last.title,expected.title))bad.push('titolo');if(!same(last.author,expected.author))bad.push('autore');if(!same(last.publisher,expected.publisher))bad.push('editore');if(!String(last.publishedDate).includes(expected.year))bad.push('pubblicazione');if(!last.plotV2)bad.push('resolver-trama-v2');if(last.plotPolicy!=='publisher-first-then-clean-fallbacks')bad.push('policy-trama');if(official.length<200)bad.push('trama-editore');if(!same(last.plot,official))bad.push('trama-editore-non-prioritaria');if(/a mio parere|secondo me|verified purchase|serie tv|adattamento cinematograf|netflix|prime video/i.test(last.plot))bad.push('rumore-trama');if(errors.length)console.log('PAGE_ERRORS',JSON.stringify(errors));if(bad.length)throw new Error('Campi trama non corretti: '+bad.join(', '));console.log('PLOT_LIVE_OK')
            }finally{await browser.close()}
          })().catch(e=>{console.error('PLOT_LIVE_FAIL',e.stack||e.message);process.exit(1)});
          JS
          node test.js 2>&1 | tee /tmp/live-isbn.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Registra esito test ISBN live
        if: always()
        run: |
          {
            echo "outcome=${{ steps.test.outcome }}"
            echo "tested_isbn=9788845278389"
            echo "source_commit=${{ github.event.workflow_run.head_sha }}"
            echo "mode=publisher-plot"
            echo '---'
            cat /tmp/live-isbn.log 2>/dev/null || true
          } > live-isbn-regression-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-isbn-regression-result.txt
          git commit -m "Registra esito test ISBN live" || exit 0
          git push
      - name: Fallisci se il test non passa
        if: steps.test.outcome != 'success'
        run: exit 1
