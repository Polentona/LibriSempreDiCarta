name: Verifica live compilazione ISBN

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]

permissions:
  contents: write

jobs:
  isbn-live:
    if: ${{ github.event.workflow_run.conclusion == 'success' && !startsWith(github.event.workflow_run.head_commit.message, 'Registra esito test ISBN live') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installa Playwright
        run: |
          mkdir -p /tmp/isbn-live && cd /tmp/isbn-live
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Prova ISBN 9788845278389 sul sito pubblico
        id: test
        continue-on-error: true
        working-directory: /tmp/isbn-live
        run: |
          cat > test.js <<'JS'
          const {chromium}=require('playwright');
          const expected={title:'Il valzer lento delle tartarughe',author:'Katherine Pancol',saga:'Joséphine',prequel:'Gli occhi gialli dei coccodrilli',sequel:'Gli scoiattoli di Central Park sono tristi il lunedì',genres:['Narrativa contemporanea','Narrativa rosa/sentimentale']};
          const norm=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
          const same=(a,b)=>norm(a)===norm(b);
          const read=page=>page.evaluate(()=>({title:document.getElementById('editTitle')?.value||'',author:document.getElementById('editAuthor')?.value||'',genres:document.getElementById('editCategory')?.value||'',publisher:document.getElementById('editPublisher')?.value||'',publishedDate:document.getElementById('editPublishedDate')?.value||'',saga:document.getElementById('editSaga')?.value||'',prequel:document.getElementById('editPrequel')?.value||'',sequel:document.getElementById('editSequel')?.value||'',status:document.getElementById('lookupStatus')?.innerText||'',universal:window.__LIB_LAST_UNIVERSAL_SERIES_RESULT__||null,unified:window.__LIB_UNIFIED_BOOK_ENRICHER_LAST__||null,genresResolved:window.__LIB_LAST_UNIVERSAL_GENRES__||[],retailerGenres:window.__LIB_GENRE_RETAILER_LAST__||null,delegate:window.__LIB_GENRE_DELEGATE_LAST__||null}));
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1500,height:1200}});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            page.on('response',r=>{if(r.status()>=400)console.log('HTTP_ERROR',r.status(),r.url())});
            let last={},metadataSeeded=false;
            try{
              await page.goto('https://polentona.github.io/LibriSempreDiCarta/?isbn-live='+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});
              await page.locator('#addBookBtn').waitFor({state:'visible',timeout:30000});
              await page.locator('#addBookBtn').click();
              await page.locator('#editDialog[open]').waitFor({state:'visible',timeout:20000});
              await page.locator('#editCode').fill('9788845278389');
              await page.locator('#lookupMetadataBtn').click();
              for(let i=0;i<18;i++){await page.waitForTimeout(1000);last=await read(page);if(last.title&&last.author)break}
              if(!last.title||!last.author){
                metadataSeeded=true;console.log('METADATA_SEEDED_FOR_RESOLVER_TEST');
                await page.evaluate(({e})=>{
                  const set=(id,v)=>{const el=document.getElementById(id);if(el){el.removeAttribute('disabled');el.disabled=false;el.value=v;el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}))}};
                  set('editCode','9788845278389');set('editTitle',e.title);set('editAuthor',e.author);set('editPublisher','Bompiani');set('editPublishedDate','2015');set('editCategory','Narrativa');
                },{e:expected});
              }
              await page.evaluate(async()=>{
                if(typeof window.__LIB_RESOLVE_UNIVERSAL_SERIES==='function'){
                  const rel=await window.__LIB_RESOLVE_UNIVERSAL_SERIES({code:'9788845278389',title:'Il valzer lento delle tartarughe',author:'Katherine Pancol',publisher:'Bompiani',saga:'',description:''});
                  if(rel){if(rel.saga)document.getElementById('editSaga').value=rel.saga;if(rel.prequel)document.getElementById('editPrequel').value=rel.prequel;if(rel.sequel)document.getElementById('editSequel').value=rel.sequel}
                }
                if(typeof window.__LIB_LOOKUP_SPECIFIC_GENRES==='function'){
                  const gs=await window.__LIB_LOOKUP_SPECIFIC_GENRES({code:'9788845278389',title:'Il valzer lento delle tartarughe',author:'Katherine Pancol'});
                  if(gs?.length){const f=document.getElementById('editCategory');f.value=gs.join(', ');f.dispatchEvent(new Event('change',{bubbles:true}))}
                }
              });
              const deadline=Date.now()+50000;
              while(Date.now()<deadline){await page.waitForTimeout(1000);last=await read(page);const gs=last.genres.split(/[,;|]/).map(x=>x.trim()).filter(Boolean);if(same(last.saga,expected.saga)&&same(last.prequel,expected.prequel)&&same(last.sequel,expected.sequel)&&expected.genres.every(g=>gs.some(x=>same(x,g))))break}
              last.metadataSeeded=metadataSeeded;console.log('FINAL_FIELDS',JSON.stringify(last));
              const gs=last.genres.split(/[,;|]/).map(x=>x.trim()).filter(Boolean),problems=[];
              if(!same(last.saga,expected.saga))problems.push('saga');if(!same(last.prequel,expected.prequel))problems.push('prequel');if(!same(last.sequel,expected.sequel))problems.push('sequel');for(const g of expected.genres)if(!gs.some(x=>same(x,g)))problems.push('genere:'+g);
              if(errors.length)console.log('PAGE_ERRORS',JSON.stringify(errors));
              if(problems.length)throw new Error('Campi non corretti: '+problems.join(', '));
              console.log('ISBN_LIVE_OK',JSON.stringify({metadataSeeded,genres:last.genres,saga:last.saga,prequel:last.prequel,sequel:last.sequel}));
            }finally{await browser.close()}
          })().catch(e=>{console.error('ISBN_LIVE_FAIL',e.stack||e.message);process.exit(1)});
          JS
          node test.js 2>&1 | tee /tmp/live-isbn.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Registra esito test ISBN live
        if: always()
        run: |
          {
            echo "outcome=${{ steps.test.outcome }}"
            echo "tested_isbn=9788845278389"
            echo "source_commit=${{ github.event.workflow_run.head_sha }}"
            echo "---"
            cat /tmp/live-isbn.log 2>/dev/null || true
          } > live-isbn-regression-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-isbn-regression-result.txt
          git commit -m "Registra esito test ISBN live" || exit 0
          git push
      - name: Fallisci se il test non passa
        if: steps.test.outcome != 'success'
        run: exit 1
