name: Verifica live compilazione ISBN

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]

permissions:
  contents: write

jobs:
  isbn-live:
    if: ${{ github.event.workflow_run.conclusion == 'success' && !startsWith(github.event.workflow_run.head_commit.message, 'Registra esito test ISBN live') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installa Playwright
        run: |
          mkdir -p /tmp/isbn-live && cd /tmp/isbn-live
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Verifica ISBN Beckett live
        id: test
        continue-on-error: true
        working-directory: /tmp/isbn-live
        run: |
          node --check "$GITHUB_WORKSPACE/series-neighbors-standalone-v5.js"
          node --check "$GITHUB_WORKSPACE/series-authoritative-runtime-v7.js"
          node --check "$GITHUB_WORKSPACE/series-relation-stabilizer-v8.js"
          node --check "$GITHUB_WORKSPACE/isbn-field-sanitizer-v2.js"
          node --check "$GITHUB_WORKSPACE/publisher-plot-lock-v8.js"
          cat > test.js <<'JS'
          const {chromium}=require('playwright');
          const expected={title:'I sussurri della morte',author:'Simon Beckett',publisher:'Bompiani',saga:'David Hunter',prequel:'Scritto nelle ossa',sequel:'La voce dei morti'};
          const norm=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
          const same=(a,b)=>norm(a)===norm(b);
          const dirtyPlot=v=>/https?|www\s*\.|€|\bacquista\b/i.test(String(v||''));
          const read=page=>page.evaluate(()=>({
            title:document.getElementById('editTitle')?.value||'',
            author:document.getElementById('editAuthor')?.value||'',
            publisher:document.getElementById('editPublisher')?.value||'',
            saga:document.getElementById('editSaga')?.value||'',
            prequel:document.getElementById('editPrequel')?.value||'',
            sequel:document.getElementById('editSequel')?.value||'',
            plot:document.getElementById('editPlot')?.value||'',
            status:document.getElementById('lookupStatus')?.innerText||'',
            loaderV48:!!window.__LIB_SERIES_NEIGHBORS_STANDALONE_V48,
            seriesV7:!!window.__LIB_SERIES_AUTHORITATIVE_RUNTIME_V7,
            seriesV8:!!window.__LIB_SERIES_AUTHORITATIVE_RUNTIME_V8,
            sanitizerV2:!!window.__LIB_ISBN_FIELD_SANITIZER_V2,
            plotSanitized:!!window.__LIB_PUBLISHER_PLOT_LOCK_V8_SANITIZED,
            policy:window.__LIB_SERIES_RELATION_POLICY||''
          }));
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1500,height:1200}}),errors=[];let http429=0;
            page.on('pageerror',e=>errors.push(e.message));
            page.on('response',r=>{if(r.status()===429)http429++;if(r.status()>=400)console.log('HTTP_ERROR',r.status(),r.url())});
            try{
              await page.goto('https://polentona.github.io/LibriSempreDiCarta/?beckett-v8-live='+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});
              await page.locator('#addBookBtn').click();
              await page.locator('#editDialog[open]').waitFor({state:'visible',timeout:20000});
              await page.locator('#editCode').fill('9788845279553');
              await page.locator('#lookupMetadataBtn').click();
              let last={};const deadline=Date.now()+120000;
              while(Date.now()<deadline){
                await page.waitForTimeout(1000);last=await read(page);
                const rel= same(last.title,expected.title)&&same(last.author,expected.author)&&same(last.publisher,expected.publisher)&&same(last.saga,expected.saga)&&same(last.prequel,expected.prequel)&&same(last.sequel,expected.sequel);
                const runtime=last.loaderV48&&last.seriesV7&&last.seriesV8&&last.sanitizerV2&&last.plotSanitized;
                const plotOk=!last.plot||!dirtyPlot(last.plot);
                if(rel&&runtime&&plotOk)break;
              }
              const pure=await page.evaluate(()=>{
                const dirty=`[](https://www. bompiani. it/catalogo/test)Simon Beckett Una trama abbastanza lunga da essere considerata valida e da consentire al pulitore di conservare il testo narrativo senza il rumore commerciale finale. Un secondo periodo completa la sinossi. € 12. 35 acquista`;
                return{colon:window.__LIB_CLEAN_PUBLISHER?.('Bompiani : Giunti')||'',joined:window.__LIB_CLEAN_PUBLISHER?.('Bompiani Giunti')||'',giunti:window.__LIB_CLEAN_PUBLISHER?.('Giunti')||'',plot:window.__LIB_CLEAN_AUTOMATIC_PLOT?.(dirty,{author:'Simon Beckett',title:'I sussurri della morte'})||''};
              });
              let direct=null;
              for(let i=0;i<5;i++){
                direct=await page.evaluate(async()=>typeof window.__LIB_RESOLVE_AUTHORITATIVE_SERIES_NEIGHBORS==='function'?await window.__LIB_RESOLVE_AUTHORITATIVE_SERIES_NEIGHBORS({code:'9788845279553',title:document.getElementById('editTitle')?.value||'',author:document.getElementById('editAuthor')?.value||'',saga:document.getElementById('editSaga')?.value||''}):null);
                if(same(direct?.prequel,expected.prequel)&&same(direct?.sequel,expected.sequel))break;
                await page.waitForTimeout(3500);
              }
              console.log('FINAL_BECKETT_V8',JSON.stringify({last,pure,direct,http429,plotDirty:dirtyPlot(last.plot)}));
              const bad=[];
              for(const k of ['title','author','publisher','saga','prequel','sequel'])if(!same(last[k],expected[k]))bad.push(k+':'+last[k]);
              if(!last.loaderV48)bad.push('loader-v48');
              if(!last.seriesV7)bad.push('series-v7');
              if(!last.seriesV8)bad.push('series-v8');
              if(!last.sanitizerV2)bad.push('sanitizer-v2');
              if(!last.plotSanitized)bad.push('plot-lock-sanitized');
              if(last.policy!=='goodreads-order-canonical-localization-stable-v8')bad.push('policy:'+last.policy);
              if(pure.colon!=='Bompiani'||pure.joined!=='Bompiani'||pure.giunti!=='Giunti')bad.push('pulizia-editore');
              if(dirtyPlot(pure.plot)||pure.plot.length<80)bad.push('pulizia-trama-pura');
              if(last.plot&&dirtyPlot(last.plot))bad.push('trama-live-sporca');
              if(!same(direct?.prequel,expected.prequel)||!same(direct?.sequel,expected.sequel))bad.push('resolver-diretto-non-localizzato');
              if(errors.length)console.log('PAGE_ERRORS',JSON.stringify(errors));
              if(bad.length)throw new Error('ISBN Beckett V8 non corretto: '+bad.join(', '));
              console.log('ISBN_BECKETT_V8_LIVE_OK');
            }finally{await browser.close()}
          })().catch(e=>{console.error('ISBN_BECKETT_V8_LIVE_FAIL',e.stack||e.message);process.exit(1)});
          JS
          node test.js 2>&1 | tee /tmp/live-isbn.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Registra esito test ISBN live
        if: always()
        run: |
          {
            echo "outcome=${{ steps.test.outcome }}"
            echo "tested_isbn=9788845279553"
            echo "source_commit=${{ github.event.workflow_run.head_sha }}"
            echo "mode=beckett-runtime-v48-series-v8-sanitizer-v2"
            echo '---'
            cat /tmp/live-isbn.log 2>/dev/null || true
          } > live-isbn-regression-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-isbn-regression-result.txt
          git commit -m "Registra esito test ISBN live" || exit 0
          git push
      - name: Fallisci se il test non passa
        if: steps.test.outcome != 'success'
        run: exit 1
