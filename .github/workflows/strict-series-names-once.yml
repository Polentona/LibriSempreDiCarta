name: Distingue saghe nominate e serie senza nome

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strict-series-names-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Applica regole generali
        run: python _strict_series_patch.py
      - name: Verifica JavaScript
        run: |
          node --check series-relations.js
          node --check italian-catalog-fallback-v3.js
          node --check isbn-cover.js
          node --check bg/bg8.js
      - name: Pubblica e pulisci
        run: |
          rm -f .github/workflows/strict-series-names-once.yml _strict_series_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add series-relations.js italian-catalog-fallback-v3.js isbn-cover.js bg/bg8.js index.html .github/workflows/strict-series-names-once.yml _strict_series_patch.py
          git diff --cached --quiet && exit 0
          git commit -m "Distingue saghe nominate e serie senza nome"
          git push origin main
