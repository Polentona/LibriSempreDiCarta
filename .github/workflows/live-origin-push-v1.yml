name: Test live Origin dopo deploy mirato

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]

permissions:
  contents: write

jobs:
  origin:
    if: ${{ github.event.workflow_run.conclusion == 'success' && contains(github.event.workflow_run.head_commit.message, 'Rilancia test live Origin workflow-run') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installa Playwright
        run: |
          mkdir -p /tmp/origin-push && cd /tmp/origin-push
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Testa ISBN 9788804681960
        id: test
        continue-on-error: true
        working-directory: /tmp/origin-push
        run: |
          cat > test.js <<'JS'
          const {chromium}=require('playwright');
          const clean=v=>String(v||'').replace(/\s+/g,' ').trim();
          const norm=v=>clean(v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
          const expected={title:'Origin',author:'Dan Brown',publisher:'Mondadori',year:'2017',saga:'Robert Langdon',prequel:'Inferno',sequel:"L'ultimo segreto"};
          const genreSet=v=>new Set(String(v||'').split(/[,;|/\n]+/).map(norm).filter(Boolean));
          const hasGenres=v=>{const wanted=['Giallo','Thriller','Avventura'].map(norm),got=genreSet(v);return got.size===wanted.length&&wanted.every(x=>got.has(x))};
          const italian=v=>{const n=' '+norm(v)+' ';return [' il ',' la ',' di ',' del ',' che ',' un ',' una ',' per ',' con ',' nel ',' non ',' e '].filter(x=>n.includes(x)).length>=4};
          const dirty=v=>/https?|www\s*\.|€|\bacquista\b|\baggiungi al carrello\b|\bprezzo\b/i.test(String(v||''));
          const read=page=>page.evaluate(()=>{const s=document.getElementById('lookupStatus'),before=getComputedStyle(s,'::before'),ed=window.__LIB_OPENLIBRARY_EXACT_EDITION_LAST__;return{title:document.getElementById('editTitle')?.value||'',author:document.getElementById('editAuthor')?.value||'',publisher:document.getElementById('editPublisher')?.value||'',year:document.getElementById('editPublishedDate')?.value||'',genre:document.getElementById('editCategory')?.value||'',genreSource:document.getElementById('editCategory')?.dataset?.genreSource||'',saga:document.getElementById('editSaga')?.value||'',prequel:document.getElementById('editPrequel')?.value||'',sequel:document.getElementById('editSequel')?.value||'',plot:document.getElementById('editPlot')?.value||'',cover:document.getElementById('editCover')?.value||'',busy:s?.dataset?.goodreadsPrimaryBusy==='1',spin:before?.animationName||'',grCover:window.__LIB_GOODREADS_PRIMARY_LAST__?.result?.goodreads?.cover||'',exactCode:ed?.edition?.code||'',exactTitle:ed?.edition?.title||'',exactAuthor:ed?.edition?.author||'',exactCover:ed?.edition?.cover||'',genreDiag:window.__LIB_GOODREADS_GENRE_DIRECT_LAST__||null,details:!!window.__LIB_GOODREADS_PRIMARY_DETAILS_INSTALLED_V3,recovery:!!window.__LIB_GOODREADS_PRIMARY_RECOVERY_INSTALLED_V2,genreDirect:!!window.__LIB_GOODREADS_GENRE_DIRECT_FALLBACK_V5_INSTALLED,editionRescue:!!window.__LIB_OPENLIBRARY_EXACT_EDITION_FALLBACK_V3,loader:!!window.__LIB_SERIES_NEIGHBORS_STANDALONE_V67}});
          function errors(x,spinSeen){const bad=[];for(const k of ['title','author','publisher','saga','prequel','sequel'])if(norm(x[k])!==norm(expected[k]))bad.push(k+'='+x[k]);if(!String(x.year).includes('2017'))bad.push('year='+x.year);if(!hasGenres(x.genre)||x.genreSource!=='goodreads')bad.push('genres='+x.genre+' source='+x.genreSource);if(x.plot.length<160||!italian(x.plot)||dirty(x.plot))bad.push('plot');const grCoverOk=!!x.grCover&&x.cover===x.grCover,exactCoverOk=x.exactCode==='9788804681960'&&!!x.exactCover&&x.cover===x.exactCover;if(!x.cover||(!grCoverOk&&!exactCoverOk))bad.push('cover');if(x.busy)bad.push('busy');if(!spinSeen)bad.push('spinner');if(!x.details||!x.recovery||!x.genreDirect||!x.editionRescue||!x.loader)bad.push('runtime');return bad}
          (async()=>{const browser=await chromium.launch({headless:true});let final=null;try{for(let a=1;a<=2;a++){const page=await browser.newPage({viewport:{width:1450,height:1200}});let spinSeen=false,http429=0;page.on('response',r=>{if(r.status()===429)http429++});await page.goto('https://polentona.github.io/LibriSempreDiCarta/?origin-workflow-run-live='+Date.now()+'-'+a,{waitUntil:'domcontentloaded',timeout:120000});await page.locator('#addBookBtn').click();await page.locator('#editDialog[open]').waitFor({state:'visible',timeout:20000});await page.waitForFunction(()=>window.__LIB_GOODREADS_PRIMARY_RECOVERY_INSTALLED_V2&&window.__LIB_GOODREADS_PRIMARY_DETAILS_INSTALLED_V3&&window.__LIB_GOODREADS_GENRE_DIRECT_FALLBACK_V5_INSTALLED&&window.__LIB_OPENLIBRARY_EXACT_EDITION_FALLBACK_V3&&window.__LIB_SERIES_NEIGHBORS_STANDALONE_V67,null,{timeout:30000});await page.locator('#editCode').fill('9788804681960');await page.locator('#lookupMetadataBtn').click();const deadline=Date.now()+180000;let last={};while(Date.now()<deadline){await page.waitForTimeout(300);last=await read(page);if(last.busy&&last.spin==='goodreadsPrimarySpin')spinSeen=true;if(!errors(last,spinSeen).length)break}last=await read(page);const bad=errors(last,spinSeen);final={attempt:a,http429,spinSeen,last,bad};console.log('ORIGIN_WORKFLOW_RUN_ATTEMPT',JSON.stringify(final));await page.close();if(!bad.length){console.log('ORIGIN_WORKFLOW_RUN_LIVE_OK',JSON.stringify(final));return}if(a<2)await new Promise(r=>setTimeout(r,12000))}throw new Error(JSON.stringify(final))}finally{await browser.close()}})().catch(e=>{console.error('ORIGIN_WORKFLOW_RUN_LIVE_FAIL',e.stack||e.message);process.exit(1)});
          JS
          node test.js 2>&1 | tee /tmp/origin-push.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Registra risultato
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            {
              echo "outcome=${{ steps.test.outcome }}"
              echo "source_commit=${{ github.event.workflow_run.head_sha }}"
              echo "mode=origin-goodreads-next-data-xml-v9-workflow-run"
              echo "record_attempt=${attempt}"
              echo '---'
              cat /tmp/origin-push.log 2>/dev/null || true
            } > live-origin-push-result.txt
            git add live-origin-push-result.txt
            git commit -m "Registra test live Origin workflow-run" || true
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          echo "Impossibile registrare il risultato Origin dopo 3 tentativi" >&2
          exit 1
      - name: Fallisci se il test non passa
        if: steps.test.outcome != 'success'
        run: exit 1
