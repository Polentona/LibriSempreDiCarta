name: Applica filtro globale trama e copertine v7
on:
  push:
    branches: [main]
    paths:
      - 'tools/patch_plot_cover_quality_v7.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Applica patch
        run: python3 tools/patch_plot_cover_quality_v7.py
      - name: Verifica sintassi JavaScript
        run: |
          node --check isbn-cover.js
          node --check italian-retailer-fallback-v2.js
          node --check italian-catalog-fallback-v3.js
          node --check isbn-resilient-fallback-v1.js
          node --check libraccio-plot-fallback.js
          node --check bg/bg8.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add isbn-cover.js italian-retailer-fallback-v2.js italian-catalog-fallback-v3.js isbn-resilient-fallback-v1.js libraccio-plot-fallback.js bg/bg8.js index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Filtra recensioni dalle trame e copertine non frontali'
          git push
