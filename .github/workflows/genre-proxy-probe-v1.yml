name: Diagnostica fonti generi

on:
  push:
    branches: [main]
    paths:
      - '_genre-proxy-probe-trigger.txt'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Verifica endpoint
        run: |
          python - <<'PY' > /tmp/probe.txt
          import urllib.request, urllib.parse, json, re
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,text/html,*/*'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      return r.status,r.read(2500000).decode('utf-8','replace'),dict(r.headers)
              except urllib.error.HTTPError as e:
                  try: body=e.read(500000).decode('utf-8','replace')
                  except Exception: body=''
                  return e.code,body,dict(e.headers)
              except Exception as e:
                  return 0,repr(e),{}

          target='https://app.thestorygraph.com/browse?search_term=9788845278389'
          proxies=[
              ('DIRECT',target),
              ('JINA','https://r.jina.ai/'+target),
              ('ALLORIGINS','https://api.allorigins.win/raw?url='+urllib.parse.quote(target,safe='')),
              ('CORSPROXY','https://corsproxy.io/?url='+urllib.parse.quote(target,safe='')),
          ]
          print('### STORYGRAPH ISBN 9788845278389')
          for name,url in proxies:
              st,raw,h=get(url)
              low=raw.lower()
              print('\n##',name,'STATUS',st,'LEN',len(raw),'ACAO',h.get('Access-Control-Allow-Origin') or h.get('access-control-allow-origin'))
              print('HAS_TITLE', 'il valzer lento delle tartarughe' in low)
              print('HAS_AUTHOR', 'katherine pancol' in low)
              m=re.search(r'(?i)(fiction|nonfiction)[^\n<]{0,220}',raw)
              print('GENRE_LINE', (m.group(0)[:240] if m else ''))
              print('HEAD',re.sub(r'\s+',' ',raw[:500])[:500])

          title='La valse lente des tortues'
          author='Katherine Pancol'
          print('\n### WIKIDATA SEARCH')
          try:
              u='https://www.wikidata.org/w/api.php?'+urllib.parse.urlencode({'action':'wbsearchentities','search':title,'language':'fr','uselang':'it','format':'json','limit':'10','origin':'*'})
              st,raw,_=get(u); print('STATUS',st,'LEN',len(raw)); d=json.loads(raw)
              for x in d.get('search',[]): print(json.dumps({'id':x.get('id'),'label':x.get('label'),'description':x.get('description'),'aliases':x.get('aliases')},ensure_ascii=False))
          except Exception as e: print('WIKIDATA ERROR',repr(e))
          PY
          cat /tmp/probe.txt
      - name: Registra risultato
        run: |
          cp /tmp/probe.txt genre-proxy-probe-result.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || true
          git add genre-proxy-probe-result.txt
          git commit -m 'Registra diagnostica fonti generi' || exit 0
          git push
