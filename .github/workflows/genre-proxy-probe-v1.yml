name: Diagnostica fonti generi

on:
  push:
    branches: [main]
    paths:
      - '_genre-proxy-probe-trigger.txt'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Verifica endpoint
        run: |
          python - <<'PY' > /tmp/probe.txt
          import urllib.request, urllib.parse, json, re
          isbn='9788845278389'
          target='https://www.unilibro.it/libro/pancol-katherine/il-valzer-lento-delle-tartarughe/'+isbn
          q='"'+isbn+'" classificazione genere'
          targets=[
            ('jina_unilibro','https://r.jina.ai/'+target),
            ('jina_bing','https://r.jina.ai/https://www.bing.com/search?setlang=it-IT&q='+urllib.parse.quote(q,safe='')),
            ('jina_google','https://r.jina.ai/https://www.google.com/search?hl=it&num=10&q='+urllib.parse.quote(q,safe='')),
            ('jina_ddg','https://r.jina.ai/https://html.duckduckgo.com/html/?q='+urllib.parse.quote(q,safe='')),
          ]
          for name,url in targets:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,text/plain,*/*'})
              with urllib.request.urlopen(req,timeout=15) as r:
                raw=r.read(1000000).decode('utf-8','replace')
                text=re.sub(r'\s+',' ',raw)
                print('\n###',name,'STATUS',r.status,'LEN',len(raw))
                for needle in ['narrativa rosa','classificazione','genere','contemporanea']:
                  i=text.lower().find(needle)
                  print(needle,'FOUND',i>=0,'EXCERPT',text[max(0,i-140):i+600] if i>=0 else '')
            except Exception as e:
              print('\n###',name,'ERROR',repr(e))
          PY
          cat /tmp/probe.txt
      - name: Registra risultato
        run: |
          cp /tmp/probe.txt genre-proxy-probe-result.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || true
          git add genre-proxy-probe-result.txt
          git commit -m 'Registra diagnostica fonti generi' || exit 0
          git push
