name: Corregge relazioni prequel sequel v6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-series-relations-v6-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Applica patch
        run: |
          echo '  sb29rdXAgdmVyc2lvbiA1IG5vbiB0cm92YXRhJykKcC53cml0ZV90ZXh0KHMsZW5jb2Rpbmc9J3V0Zi04JykK' | tr -d ' ' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Verifica JavaScript
        run: |
          node --check series-relations.js
          node --check isbn-cover.js
          node --check bg/bg8.js
          grep -q 'series-relations.js?v=6' bg/bg8.js
          grep -q 'RELATIONS_LOOKUP_VERSION=6' isbn-cover.js
      - name: Pubblica e pulisci
        run: |
          rm -f .github/workflows/fix-series-relations-v6-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add series-relations.js isbn-cover.js bg/bg8.js .github/workflows/fix-series-relations-v6-once.yml
          git commit -m "Rende robusta la ricerca di prequel e sequel"
          git push origin main
