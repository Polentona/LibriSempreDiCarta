name: Aggiunge vista Saghe e trilogie

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-sagas-view-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Applica patch
        run: python _patch_sagas_view.py
      - name: Verifica JavaScript
        run: |
          node --check isbn-cover.js
          node --check bg/bg8.js
      - name: Pubblica e pulisci
        run: |
          rm -f .github/workflows/add-sagas-view-once.yml _patch_sagas_view.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html isbn-cover.js bg/bg8.js .github/workflows/add-sagas-view-once.yml _patch_sagas_view.py
          git diff --cached --quiet && exit 0
          git commit -m "Aggiunge Saghe e trilogie e conserva i titoli completi"
          git push origin main