name: Completa relazioni indipendentemente dalla fonte v6
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-decoupled-series-v6.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Applica patch
        run: python tools/decouple_series_resolution_v6.py
      - name: Verifica sintassi
        run: |
          node --check isbn-cover.js
          node --check series-universal-resolver-v1.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add isbn-cover.js index.html
          git commit -m "Separa la ricerca delle relazioni dalla fonte ISBN"
          git push
