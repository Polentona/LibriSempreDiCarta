name: Valida saga e relazioni

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/validate-series-relations-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Applica patch
        run: python _validate_series_patch.py
      - name: Verifica JavaScript
        run: |
          node --check series-relations.js
          node --check isbn-cover.js
          node --check bg/bg8.js
      - name: Pubblica e pulisci
        run: |
          rm -f .github/workflows/validate-series-relations-once.yml _validate_series_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add isbn-cover.js bg/bg8.js index.html .github/workflows/validate-series-relations-once.yml _validate_series_patch.py
          git diff --cached --quiet && exit 0
          git commit -m "Valida saga e relazioni prima di mostrarle"
          git push origin main
