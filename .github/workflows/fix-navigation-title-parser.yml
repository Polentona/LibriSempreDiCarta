name: Corregge titoli Amazon e navigazione

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-navigation-title-parser.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Correggi parser titolo generale
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          block = r'''
          function cleanBookTitleCandidate(v){
            let t=cleanLine(v);if(!t)return'';
            const amazonSeo=/\s*:\s*Amazon(?:\.it)?\s*:\s*(?:Books?|Libri)\s*$/i;
            const wasAmazonSeo=amazonSeo.test(t);
            t=t.replace(amazonSeo,'').replace(/\s*[-|]\s*Amazon(?:\.it)?(?:\s*:\s*(?:Books?|Libri))?\s*$/i,'').trim();
            if(wasAmazonSeo){
              const parts=t.split(/\s+:\s+/);
              if(parts.length>1){
                const tail=parts[parts.length-1].trim();
                const creditsLike=/^[A-Za-zÀ-ÿ'’.-]+,\s*[A-Za-zÀ-ÿ'’.-]+(?:\s+[A-Za-zÀ-ÿ'’.-]+)*(?:,\s*[A-Za-zÀ-ÿ'’.-]+(?:\s+[A-Za-zÀ-ÿ'’.-]+)*)*\.?$/.test(tail);
                if(creditsLike)t=parts.slice(0,-1).join(' : ').trim();
              }
            }
            return t.replace(/\s+/g,' ').trim()
          }
          function titleFrom(text,code){
            const labeled=fieldAfter(text,['Titolo','Title']);
            if(labeled){
              let cleaned=cleanBookTitleCandidate(labeled).replace(new RegExp('\\s*[-–—]?\\s*'+norm(code)+'\\s*$'),'').trim();
              cleaned=cleanBookTitleCandidate(cleaned);
              if(cleaned&&!isNavigationTitle(cleaned))return cleaned
            }
            const lines=String(text||'').split(/\n/);
            let best='',bestScore=-99;
            for(let i=0;i<lines.length;i++){
              const raw=lines[i];if(!/^\s*#{1,3}\s+/.test(raw))continue;
              let h=cleanBookTitleCandidate(raw);if(!h||h.length<2||h.length>190||isNavigationTitle(h))continue;
              h=cleanBookTitleCandidate(h.replace(new RegExp('\\s*[-–—|]?\\s*'+norm(code)+'\\s*$','i'),'').trim());
              if(!h||isNavigationTitle(h))continue;
              const around=plain(lines.slice(Math.max(0,i-5),i+10).join('\n'));
              let score=2;
              if(codeAppears(h,code))score+=6;
              if(codeAppears(around,code))score+=5;
              if(/\((?:Autore|Autrice|Author)\)|\b(?:Autore|Autrice|Author|Editore|Publisher|ISBN|EAN)\b/i.test(around))score+=3;
              if(/\b(?:copertina flessibile|copertina rigida|formato kindle|paperback|hardcover)\b/i.test(around))score+=2;
              if(/^.{2,90}$/.test(h))score+=1;
              if(score>bestScore){best=h;bestScore=score}
            }
            return best
          }
          function isNavigationTitle(v){
            const n=normText(v);if(!n)return true;
            return /^(?:skip to(?: .*)?|salta a(?: .*)?|main content|contenuto principale|keyboard shortcuts?|scorciatoie da tastiera|search|cerca|cart|carrello|navigation|navigazione|menu|home|libri|ricerca|risultati|descrizione|sinossi|trama|dettagli|informazioni|recensioni|libro di|un libro di|back to top|torna su|select your cookie preferences|cookie preferences|accessibility|accessibilita|amazon|amazon it|account e liste|resi e ordini|tutte le categorie|tutto|buy now|acquista ora|aggiungi al carrello)$/i.test(n)
          }
          '''
          block=textwrap.dedent(block)

          p=Path('italian-catalog-fallback-v3.js')
          s=p.read_text(encoding='utf-8')
          start=s.index('function titleFrom(text,code){')
          # Se esiste già la funzione di pulizia, includila nella sostituzione.
          maybe=s.rfind('function cleanBookTitleCandidate(v){',0,start)
          if maybe>=0 and start-maybe<2500:start=maybe
          end=s.index('function cleanAuthorCandidate(v){',start)
          s=s[:start]+block+s[end:]
          p.write_text(s,encoding='utf-8')

          # Mantieni la stessa regola anche se in futuro viene rigenerato il parser generale.
          p=Path('tools/generalize_book_metadata_rules.py')
          g=p.read_text(encoding='utf-8')
          marker='# GENERAL_AMAZON_SEO_TITLE_FILTER_V1'
          if marker not in g:
            addition = r'''

          # GENERAL_AMAZON_SEO_TITLE_FILTER_V1
          # Dopo ogni rigenerazione, ripristina la pulizia dei titoli SEO Amazon.
          p = Path('italian-catalog-fallback-v3.js')
          s = p.read_text(encoding='utf-8')
          _title_block = r'''function cleanBookTitleCandidate(v){
            let t=cleanLine(v);if(!t)return'';
            const amazonSeo=/\s*:\s*Amazon(?:\.it)?\s*:\s*(?:Books?|Libri)\s*$/i;
            const wasAmazonSeo=amazonSeo.test(t);
            t=t.replace(amazonSeo,'').replace(/\s*[-|]\s*Amazon(?:\.it)?(?:\s*:\s*(?:Books?|Libri))?\s*$/i,'').trim();
            if(wasAmazonSeo){
              const parts=t.split(/\s+:\s+/);
              if(parts.length>1){
                const tail=parts[parts.length-1].trim();
                const creditsLike=/^[A-Za-zÀ-ÿ'’.-]+,\s*[A-Za-zÀ-ÿ'’.-]+(?:\s+[A-Za-zÀ-ÿ'’.-]+)*(?:,\s*[A-Za-zÀ-ÿ'’.-]+(?:\s+[A-Za-zÀ-ÿ'’.-]+)*)*\.?$/.test(tail);
                if(creditsLike)t=parts.slice(0,-1).join(' : ').trim();
              }
            }
            return t.replace(/\s+/g,' ').trim()
          }
          function titleFrom(text,code){
            const labeled=fieldAfter(text,['Titolo','Title']);
            if(labeled){let cleaned=cleanBookTitleCandidate(labeled).replace(new RegExp('\\s*[-–—]?\\s*'+norm(code)+'\\s*$'),'').trim();cleaned=cleanBookTitleCandidate(cleaned);if(cleaned&&!isNavigationTitle(cleaned))return cleaned}
            const lines=String(text||'').split(/\n/);let best='',bestScore=-99;
            for(let i=0;i<lines.length;i++){
              const raw=lines[i];if(!/^\s*#{1,3}\s+/.test(raw))continue;
              let h=cleanBookTitleCandidate(raw);if(!h||h.length<2||h.length>190||isNavigationTitle(h))continue;
              h=cleanBookTitleCandidate(h.replace(new RegExp('\\s*[-–—|]?\\s*'+norm(code)+'\\s*$','i'),'').trim());if(!h||isNavigationTitle(h))continue;
              const around=plain(lines.slice(Math.max(0,i-5),i+10).join('\n'));let score=2;
              if(codeAppears(h,code))score+=6;if(codeAppears(around,code))score+=5;
              if(/\((?:Autore|Autrice|Author)\)|\b(?:Autore|Autrice|Author|Editore|Publisher|ISBN|EAN)\b/i.test(around))score+=3;
              if(/\b(?:copertina flessibile|copertina rigida|formato kindle|paperback|hardcover)\b/i.test(around))score+=2;
              if(/^.{2,90}$/.test(h))score+=1;if(score>bestScore){best=h;bestScore=score}
            }
            return best
          }
          function isNavigationTitle(v){const n=normText(v);if(!n)return true;return /^(?:skip to(?: .*)?|salta a(?: .*)?|main content|contenuto principale|keyboard shortcuts?|scorciatoie da tastiera|search|cerca|cart|carrello|navigation|navigazione|menu|home|libri|ricerca|risultati|descrizione|sinossi|trama|dettagli|informazioni|recensioni|libro di|un libro di|back to top|torna su|select your cookie preferences|cookie preferences|accessibility|accessibilita|amazon|amazon it|account e liste|resi e ordini|tutte le categorie|tutto|buy now|acquista ora|aggiungi al carrello)$/i.test(n)}
          '''
          _start=s.index('function titleFrom(text,code){')
          _maybe=s.rfind('function cleanBookTitleCandidate(v){',0,_start)
          if _maybe>=0 and _start-_maybe<2500:_start=_maybe
          _end=s.index('function cleanAuthorCandidate(v){',_start)
          s=s[:_start]+_title_block+s[_end:]
          p.write_text(s,encoding='utf-8')
          '''
            g += textwrap.dedent(addition)
            p.write_text(g,encoding='utf-8')

          p=Path('bg/bg8.js')
          b=p.read_text(encoding='utf-8').replace("italian-catalog-fallback-v3.js?v=7","italian-catalog-fallback-v3.js?v=8")
          p.write_text(b,encoding='utf-8')
          PY
      - name: Verifica JavaScript
        run: |
          node --check italian-catalog-fallback-v3.js
          node --check bg/bg8.js
          python -m py_compile tools/generalize_book_metadata_rules.py
      - name: Pubblica
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add italian-catalog-fallback-v3.js tools/generalize_book_metadata_rules.py bg/bg8.js
          git diff --cached --quiet && exit 0
          git commit -m "Pulisce i titoli SEO Amazon"
          git push origin main
