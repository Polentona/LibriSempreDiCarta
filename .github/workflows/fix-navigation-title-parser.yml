name: Migliora riconoscimento saghe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-navigation-title-parser.yml'
      - 'tools/improve_saga_detection.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Applica regole saga
        run: python tools/improve_saga_detection.py
      - name: Verifica JavaScript
        run: |
          node --check italian-catalog-fallback-v3.js
          node --check bg/bg8.js
      - name: Pubblica
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add italian-catalog-fallback-v3.js bg/bg8.js
          git diff --cached --quiet && exit 0
          git commit -m "Riconosce saghe da elenchi espliciti e Google Books"
          git push origin main
