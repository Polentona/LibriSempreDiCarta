name: PR metadata and series check

on:
  pull_request:
    branches: [main]
    paths:
      - 'goodreads-primary-metadata-v1.js'
      - 'series-neighbors-standalone-v5.js'
      - 'series-saga-lock-v9.js'
      - 'storygraph-genre-lock-v4.js'
      - 'isbn-enrichment-progress-v10.js'
      - 'publisher-plot-lock-v8.js'
      - 'scripts/test-saga-genres-v9.js'
      - 'scripts/test-plot-progress-v11.js'
      - 'scripts/test-goodreads-primary-metadata-v1.js'
      - '.github/workflows/pages.yml'
      - '.github/workflows/pr-isbn-wolves-check.yml'
      - '.nojekyll'

permissions:
  contents: read

concurrency:
  group: pr-metadata-series-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sintassi e configurazione runtime
        run: |
          node --check goodreads-primary-metadata-v1.js
          node --check storygraph-genre-lock-v4.js
          node --check isbn-enrichment-progress-v10.js
          node --check series-neighbors-standalone-v5.js
          node --check series-saga-lock-v9.js
          node --check publisher-plot-lock-v8.js
          node --check scripts/test-saga-genres-v9.js
          node --check scripts/test-plot-progress-v11.js
          node --check scripts/test-goodreads-primary-metadata-v1.js
          grep -q '__LIB_SERIES_NEIGHBORS_STANDALONE_V54' series-neighbors-standalone-v5.js
          grep -q '__LIB_GOODREADS_PRIMARY_METADATA_V1' goodreads-primary-metadata-v1.js
          grep -q '__LIB_STORYGRAPH_GENRE_LOCK_V6' storygraph-genre-lock-v4.js
          grep -q '__LIB_SERIES_SAGA_LOCK_V10' series-saga-lock-v9.js
          grep -q '__LIB_ISBN_ENRICHMENT_PROGRESS_V11' isbn-enrichment-progress-v10.js
          grep -q '__LIB_PUBLISHER_PLOT_LOCK_V9' publisher-plot-lock-v8.js
          grep -q "goodreads-primary-then-storygraph-then-fallback-v1" series-neighbors-standalone-v5.js
          grep -q "goodreads-primary-physical-italian-then-storygraph-v1" series-neighbors-standalone-v5.js
          grep -q "goodreads-italian-primary-then-storygraph-translated-v1" series-neighbors-standalone-v5.js
          ! grep -q 'it.wikipedia.org' goodreads-primary-metadata-v1.js
          test -f .nojekyll
      - name: Test Goodreads primario
        run: node scripts/test-goodreads-primary-metadata-v1.js

  integration:
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test progress, Saga e Generi
        run: node scripts/test-saga-genres-v9.js
      - name: Test progress trama V11
        run: node scripts/test-plot-progress-v11.js
