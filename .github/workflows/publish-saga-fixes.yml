name: Pubblica correzioni saga

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-saga-fixes.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Valida e forza nuove versioni
        shell: bash
        run: |
          node --check isbn-cover.js
          node --check italian-catalog-fallback-v3.js
          python - <<'PY'
          from pathlib import Path
          p=Path('bg/bg8.js');s=p.read_text(encoding='utf-8')
          s=s.replace('isbn-cover.js?v=6','isbn-cover.js?v=7').replace('italian-catalog-fallback-v3.js?v=1','italian-catalog-fallback-v3.js?v=2')
          p.write_text(s,encoding='utf-8')
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          s=s.replace('bg${i}.js?v=7','bg${i}.js?v=8')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bg/bg8.js index.html
          git commit -m "Pubblica correzioni autore saga e copertine"
          git push origin main
