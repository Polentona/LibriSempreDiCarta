name: Collega fallback relazioni v7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/load-direct-relations-v7-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Collega nuovo fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="series-relations-direct-v7.js?v=1"></script>'
          if tag not in s:
              if '</body>' not in s: raise SystemExit('chiusura body non trovata')
              s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')

          p=Path('isbn-cover.js')
          s=p.read_text(encoding='utf-8')
          if 'RELATIONS_LOOKUP_VERSION=6' in s:
              s=s.replace('RELATIONS_LOOKUP_VERSION=6','RELATIONS_LOOKUP_VERSION=7',1)
          elif 'RELATIONS_LOOKUP_VERSION=7' not in s:
              raise SystemExit('versione lookup non trovata')
          p.write_text(s,encoding='utf-8')

          p=Path('bg/bg8.js')
          s=p.read_text(encoding='utf-8')
          if 'isbn-cover.js?v=17' in s:
              s=s.replace('isbn-cover.js?v=17','isbn-cover.js?v=18',1)
          elif 'isbn-cover.js?v=18' not in s:
              raise SystemExit('versione isbn-cover loader non trovata')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verifica
        run: |
          node --check series-relations-direct-v7.js
          node --check isbn-cover.js
          node --check bg/bg8.js
          grep -q 'series-relations-direct-v7.js?v=1' index.html
          grep -q 'RELATIONS_LOOKUP_VERSION=7' isbn-cover.js
          grep -q 'isbn-cover.js?v=18' bg/bg8.js
      - name: Pubblica e pulisci
        run: |
          rm -f .github/workflows/load-direct-relations-v7-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html isbn-cover.js bg/bg8.js .github/workflows/load-direct-relations-v7-once.yml
          git commit -m "Usa fallback diretto per prequel e sequel"
          git push origin main
