name: Fix regressione titolo Shining
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-shining-title-regression.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python tools/patch_shining_title_regression.py
      - run: node --check isbn-cover.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add isbn-cover.js bg/bg8.js index.html
          git commit -m "Mantiene il titolo italiano verificato di Shining"
          git push origin main
