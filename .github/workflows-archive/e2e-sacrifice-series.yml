name: E2E live Sacrifice prequel sequel
on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]
permissions:
  contents: read
jobs:
  test-sacrifice:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installa Playwright
        run: |
          mkdir -p /tmp/e2e-sacrifice
          cd /tmp/e2e-sacrifice
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Prova inserimento ISBN sul sito pubblico
        working-directory: /tmp/e2e-sacrifice
        run: |
          cat > test.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext();
            const page = await context.newPage();
            const consoleLines=[];
            page.on('console', m=>consoleLines.push(`[${m.type()}] ${m.text()}`));
            page.on('pageerror', e=>consoleLines.push(`[pageerror] ${e.message}`));
            const url='https://polentona.github.io/LibriSempreDiCarta/?e2e='+Date.now();
            let result={url};
            const snapshot=()=>page.evaluate(()=>({
              title:document.querySelector('#editTitle')?.value||'',
              author:document.querySelector('#editAuthor')?.value||'',
              saga:document.querySelector('#editSaga')?.value||'',
              prequel:document.querySelector('#editPrequel')?.value||'',
              sequel:document.querySelector('#editSequel')?.value||'',
              status:document.querySelector('#lookupStatus')?.textContent||'',
              statusClass:document.querySelector('#lookupStatus')?.className||'',
              lastNeighbors:window.__LIB_LAST_NEIGHBORS_RESULT__||null,
              lastNeighborsError:window.__LIB_LAST_NEIGHBORS_ERROR__||null,
              neighborsDiag:window.__LIB_SERIES_NEIGHBORS_LAST_DIAG__||null,
              resolverLoaded:typeof window.__LIB_RESOLVE_SERIES_NEIGHBORS==='function',
              relationsLoaded:typeof window.__LIB_FIND_RELATIONS==='function'
            }));
            try{
              await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
              await page.locator('#addBookBtn').waitFor({state:'visible',timeout:30000});
              await page.locator('#addBookBtn').click();
              await page.locator('#editCode').waitFor({state:'visible',timeout:30000});
              await page.locator('#editCode').fill('9788850234547');
              await page.locator('#lookupMetadataBtn').click();

              await page.waitForFunction(()=>{
                const title=document.querySelector('#editTitle')?.value||'';
                const overlay=document.querySelector('#metadataOverlay');
                return /Sacrifice/i.test(title)||(overlay&&overlay.open);
              },null,{timeout:90000});

              const overlayOpen=await page.locator('#metadataOverlay').evaluate(el=>!!el.open).catch(()=>false);
              if(overlayOpen){
                const choices=page.locator('[data-meta-choice]');
                const count=await choices.count();
                let chosen=false;
                for(let i=0;i<count;i++){
                  const text=await choices.nth(i).innerText();
                  if(/Sacrifice/i.test(text)&&/Adornetto/i.test(text)){await choices.nth(i).click();chosen=true;break}
                }
                if(!chosen&&count===1)await choices.first().click();
              }

              await page.waitForFunction(()=>{
                const title=document.querySelector('#editTitle')?.value||'';
                const author=document.querySelector('#editAuthor')?.value||'';
                return /Sacrifice/i.test(title)&&/Adornetto/i.test(author);
              },null,{timeout:60000});

              await page.waitForFunction(()=>{
                const p=(document.querySelector('#editPrequel')?.value||'').trim();
                const s=(document.querySelector('#editSequel')?.value||'').trim();
                const status=document.querySelector('#lookupStatus');
                const busy=status?.classList.contains('busy')||status?.classList.contains('lookup-busy')||!!status?.querySelector('.lookup-book-spinner');
                return (p&&s)||window.__LIB_LAST_NEIGHBORS_RESULT__||window.__LIB_LAST_NEIGHBORS_ERROR__||!busy;
              },null,{timeout:120000}).catch(()=>{});
              await page.waitForTimeout(750);
              result=await snapshot();
              await page.screenshot({path:'sacrifice-e2e.png',fullPage:true});
              fs.writeFileSync('sacrifice-e2e.json',JSON.stringify({result,consoleLines},null,2));
              console.log('E2E_RESULT='+JSON.stringify(result));
              console.log('E2E_CONSOLE='+JSON.stringify(consoleLines));
              const ok=/^Rebel$/i.test(result.prequel.trim())&&/^Heaven$/i.test(result.sequel.trim())&&/^Rebel$/i.test(result.saga.trim());
              if(!ok)throw new Error(`Campi non corretti: saga=${JSON.stringify(result.saga)} prequel=${JSON.stringify(result.prequel)} sequel=${JSON.stringify(result.sequel)}`);
            }catch(e){
              try{result=await snapshot()}catch(_){}
              try{await page.screenshot({path:'sacrifice-e2e.png',fullPage:true})}catch(_){}
              try{fs.writeFileSync('sacrifice-e2e.json',JSON.stringify({result,consoleLines,error:String(e&&e.stack||e)},null,2))}catch(_){}
              console.error('E2E_RESULT_ON_FAILURE='+JSON.stringify(result));
              console.error('E2E_CONSOLE='+JSON.stringify(consoleLines));
              console.error('E2E_FAILURE',e);
              process.exitCode=1;
            }finally{
              await browser.close();
            }
          })();
          JS
          node test.js
      - name: Carica diagnostica E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacrifice-e2e-diagnostics
          path: |
            /tmp/e2e-sacrifice/sacrifice-e2e.json
            /tmp/e2e-sacrifice/sacrifice-e2e.png
          if-no-files-found: ignore
          retention-days: 3
