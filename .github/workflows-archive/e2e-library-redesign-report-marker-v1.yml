name: Report live redesign libreria v1

on:
  push:
    branches: ["main"]
    paths:
      - "deploy-library-redesign-20260818.txt"

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installa Playwright
        run: |
          mkdir -p /tmp/e2e-report && cd /tmp/e2e-report
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Attendi Pages
        run: sleep 60
      - name: Test
        id: test
        continue-on-error: true
        working-directory: /tmp/e2e-report
        run: |
          cat > test.js <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1920,height:1080}});
            const books=[
              {id:1,title:'Fallen',author:'Lauren Kate',category:'Fantasy',saga:'Fallen',publishedDate:'2009',rating:4,inLibrary:true,read:true,cover:'',plot:'',notes:'',loanTo:'',loanDate:''},
              {id:2,title:'Torment',author:'Lauren Kate',category:'Fantasy',saga:'Fallen',publishedDate:'2010',rating:5,inLibrary:false,read:true,cover:'',plot:'',notes:'',loanTo:'',loanDate:''},
              {id:3,title:'Passion',author:'Lauren Kate',category:'Fantasy',saga:'Fallen',publishedDate:'2011',rating:3,inLibrary:true,read:false,cover:'',plot:'',notes:'',loanTo:'',loanDate:''},
              {id:4,title:'Rapture',author:'Lauren Kate',category:'Fantasy',saga:'Fallen',publishedDate:'2012',rating:4,inLibrary:false,read:false,cover:'',plot:'',notes:'',loanTo:'',loanDate:''},
              {id:5,title:'Fallen in Love',author:'Lauren Kate',category:'Fantasy',saga:'Fallen',publishedDate:'2012',rating:0,inLibrary:true,read:false,cover:'',plot:'',notes:'',loanTo:'',loanDate:''},
              {id:6,title:'Angels in the Dark',author:'Lauren Kate',category:'Fantasy',saga:'Fallen',publishedDate:'2013',rating:0,inLibrary:false,read:false,cover:'',plot:'',notes:'',loanTo:'',loanDate:''},
              {id:7,title:'Unforgiven',author:'Lauren Kate',category:'Fantasy',saga:'Fallen',publishedDate:'2015',rating:0,inLibrary:true,read:false,cover:'',plot:'',notes:'',loanTo:'',loanDate:''},
              {id:8,title:'Shining',author:'Stephen King',category:'Horror',saga:'',publishedDate:'1977',rating:5,inLibrary:true,read:true,cover:'',plot:'',notes:'',loanTo:'',loanDate:''},
              {id:9,title:'La voce dei morti',author:'Simon Beckett',category:'Thriller',saga:'David Hunter',publishedDate:'2011',rating:4,inLibrary:false,read:false,cover:'',plot:'',notes:'',loanTo:'',loanDate:''},
              {id:10,title:'Sacrifice',author:'Alexandra Adornetto',category:'Fantasy',saga:'Rebel',publishedDate:'2012',rating:2,inLibrary:true,read:false,cover:'',plot:'',notes:'',loanTo:'',loanDate:''}
            ];
            const r={};
            try{
              await page.goto('https://polentona.github.io/LibriSempreDiCarta/?report='+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});
              await page.evaluate(data=>{localStorage.setItem('libriDiCarta.books.v1',JSON.stringify(data));localStorage.removeItem('libriDiCarta.seriesNotes.v1')},books);
              await page.reload({waitUntil:'domcontentloaded',timeout:120000});
              await page.locator('#addBookBtn').waitFor({state:'visible',timeout:30000});
              r.home=await page.locator('.book').count();if(r.home!==10)throw new Error('home '+r.home);
              const nav=await page.locator('.nav').boundingBox(),add=await page.locator('#addBookBtn').boundingBox();r.navContained=!!(nav&&add&&add.x+add.width<=nav.x+nav.width+1);if(!r.navContained)throw new Error('nav overflow');
              await page.locator('[data-view="library"]').click();r.library=await page.locator('.book').count();if(r.library!==6)throw new Error('library '+r.library);
              await page.locator('.book').first().locator('[data-edit]').click();r.inLibrary=await page.locator('#editInLibrary').count();if(r.inLibrary!==1)throw new Error('checkbox');await page.locator('#cancelEdit').click();
              await page.locator('[data-view="authors"]').click();r.letters=await page.locator('.alphabet-btn').count();r.authors=await page.locator('.author-entry-name').allInnerTexts();if(r.letters!==26||r.authors.join('|')!=='Alexandra Adornetto|Simon Beckett|Lauren Kate|Stephen King')throw new Error('authors '+r.authors.join('|'));
              await page.locator('[data-author-letter="K"]').click();if((await page.locator('.author-entry-name').allInnerTexts()).join('|')!=='Lauren Kate')throw new Error('letter K');
              await page.locator('[data-view="categories"]').click();await page.locator('#categoryFilter').selectOption({label:'Fantasy'});r.fantasy=await page.locator('.book').count();if(r.fantasy!==8)throw new Error('fantasy '+r.fantasy);
              await page.locator('[data-view="series"]').click();r.series=await page.locator('.series-row').count();if(r.series!==3)throw new Error('series '+r.series);
              const fallen=page.locator('.series-row').filter({hasText:'FALLEN'}).first();r.covers1=await fallen.locator('.series-cover-card').count();if(r.covers1!==5)throw new Error('covers1 '+r.covers1);await fallen.locator('[data-series-dir="1"]').click();const fallen2=page.locator('.series-row').filter({hasText:'FALLEN'}).first();r.covers2=await fallen2.locator('.series-cover-card').count();if(r.covers2!==2)throw new Error('covers2 '+r.covers2);
              const note=fallen2.locator('[data-series-note]');await note.fill('Saga completa');await note.blur();await page.locator('[data-view="home"]').click();await page.locator('[data-view="series"]').click();r.note=await page.locator('.series-row').filter({hasText:'FALLEN'}).first().locator('[data-series-note]').inputValue();if(r.note!=='Saga completa')throw new Error('note');
              console.log('REPORT_OK '+JSON.stringify(r));
            }catch(e){console.error('REPORT_FAIL '+e.message+' '+JSON.stringify(r));process.exitCode=1}
            await browser.close();
          })();
          JS
          node test.js 2>&1 | tee /tmp/report.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Commit report
        if: always()
        run: |
          echo "outcome=${{ steps.test.outcome }}" > e2e-library-redesign-marker-result.txt
          cat /tmp/report.log >> e2e-library-redesign-marker-result.txt 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e-library-redesign-marker-result.txt
          git commit -m "Registra report live redesign"
          git push
      - name: Fail if needed
        if: steps.test.outcome != 'success'
        run: exit 1
