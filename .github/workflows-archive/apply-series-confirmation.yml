name: Applica conferma generale delle saghe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-series-confirmation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Applica e valida
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          node --check italian-catalog-fallback-v3.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add italian-catalog-fallback-v3.js bg/bg8.js
          git commit -m "Conferma le saghe con una ricerca bibliografica generale"
          git push origin main
