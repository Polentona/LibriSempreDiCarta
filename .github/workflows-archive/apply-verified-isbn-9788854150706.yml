name: Applica fallback verificato ISBN 9788854150706

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-verified-isbn-9788854150706.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Applica record verificato
        run: python scripts/add_verified_isbn_9788854150706.py
      - name: Verifica JavaScript
        run: node --check isbn-cover.js
      - name: Pubblica modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add isbn-cover.js bg/bg8.js index.html
          git commit -m "Garantisce titolo autore e saga corretti per ISBN 9788854150706"
          git push origin main
