name: Applica correzioni metadati ISBN

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-metadata-v4.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Applica patch
        run: python scripts/fix_metadata_v4.py
      - name: Verifica JavaScript
        run: |
          node --check italian-catalog-fallback-v3.js
          node --check isbn-cover.js
      - name: Pubblica modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add italian-catalog-fallback-v3.js isbn-cover.js bg/bg8.js index.html
          git commit -m "Corregge autore saga titolo e libro rotante durante la ricerca"
          git push origin main
