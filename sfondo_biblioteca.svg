    <g transform="translate(28 394)"><circle r="5.3"/><circle cx="6" cy="-4" r="3.7"/><circle cx="-6" cy="-3" r="3.6"/></g>
    <g transform="translate(133 376)"><circle r="5.6"/><circle cx="6" cy="-4" r="3.8"/><circle cx="-6" cy="-4" r="3.8"/></g>
  </g>
</g>

<!-- three complete paper clips, bottom left -->
