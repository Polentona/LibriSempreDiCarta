<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
  <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018 0.055" numOctaves="4" seed="13" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
    <feComponentTransfer in="mono" result="soft"><feFuncA type="table" tableValues="0 0.12"/></feComponentTransfer>
    <feBlend in="SourceGraphic" in2="soft" mode="multiply"/>
  </filter>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f0e5"/><stop offset="0.52" stop-color="#f5eadc"/><stop offset="1" stop-color="#f8f1e7"/></linearGradient>
  <linearGradient id="pencil" x1="0" x2="1"><stop offset="0" stop-color="#e9ba72"/><stop offset=".22" stop-color="#d99b4c"/><stop offset=".78" stop-color="#c7853e"/><stop offset="1" stop-color="#e3ad63"/></linearGradient>
  <linearGradient id="wood" x1="0" x2="1"><stop offset="0" stop-color="#ecd0a4"/><stop offset=".5" stop-color="#dfb67f"/><stop offset="1" stop-color="#c9945e"/></linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#795b3c" flood-opacity=".15"/></filter>
</defs>
<rect width="1600" height="1000" fill="url(#bg)" filter="url(#paper)"/>
