    <g transform="translate(42 142)"><circle r="6"/><circle cx="7" cy="-4" r="4.2"/><circle cx="-7" cy="-4" r="4.1"/></g>
    <g transform="translate(99 189)"><circle r="6.4"/><circle cx="7" cy="-5" r="4.4"/><circle cx="-7" cy="-4" r="4.3"/><circle cx="5" cy="6" r="3.9"/></g>
    <g transform="translate(154 190)"><circle r="6.8"/><circle cx="8" cy="-5" r="4.8"/><circle cx="-8" cy="-4" r="4.7"/><circle cx="6" cy="7" r="4.1"/></g>
