<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
<defs>
  <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="4" seed="8" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
    <feComponentTransfer in="mono" result="soft"><feFuncA type="table" tableValues="0 0.055"/></feComponentTransfer>
    <feBlend in="SourceGraphic" in2="soft" mode="multiply"/>
  </filter>
  <radialGradient id="bg" cx="48%" cy="40%" r="78%">
    <stop offset="0" stop-color="#fbf6ee"/>
    <stop offset=".6" stop-color="#f6eee3"/>
    <stop offset="1" stop-color="#f3e7d8"/>
  </radialGradient>
  <linearGradient id="pencil" x1="0" x2="1"><stop offset="0" stop-color="#edbe78"/><stop offset=".18" stop-color="#db9c4f"/><stop offset=".82" stop-color="#c98740"/><stop offset="1" stop-color="#e6ad63"/></linearGradient>
  <linearGradient id="wood" x1="0" x2="1"><stop offset="0" stop-color="#edd3aa"/><stop offset=".5" stop-color="#dfb57c"/><stop offset="1" stop-color="#c88f56"/></linearGradient>
  <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#715538" flood-opacity=".14"/></filter>
</defs>

<rect width="1536" height="1024" fill="url(#bg)"/>
<rect width="1536" height="1024" fill="#f7efe4" opacity=".28" filter="url(#paper)"/>

